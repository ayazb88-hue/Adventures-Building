<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121a15">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Siedlung">
<title>Siedlung</title>
<style>
  :root {
    --bg: #121a15;
    --panel: #1b261e;
    --panel-2: #243127;
    --text: #ecf1e8;
    --muted: #9db09c;
    --accent: #f0b54a;
    --hunger: #e0664f;
    --energy: #6fcf6a;
    --social: #6fb6ef;
    --mood: #e9c46a;
    --border: #2f3f32;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent; }
  body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  .wrap { max-width: 760px; margin: 0 auto; padding-block: 8px 20px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  button { font: inherit; color: var(--text); cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  header { padding-bottom: 8px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  #clock { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ctrls { display: flex; gap: 4px; }
  .ctrls button { min-width: 42px; height: 36px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); font-weight: 600; }
  .ctrls button.active { background: var(--accent); color: #2a1d05; border-color: var(--accent); }
  #soundBtn { position: absolute; right: 8px; top: 8px; width: 40px; height: 40px; border-radius: 10px; border: 1px solid #ffffff22; background: #121a15cc; font-size: 18px; backdrop-filter: blur(4px); }
  #soundBtn.active { border-color: var(--accent); }
  #stats { margin: 6px 0; color: var(--muted); font-variant-numeric: tabular-nums; }
  #stats b { color: var(--text); }
  .goal { height: 5px; background: #0005; border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .goal > i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
  #log { list-style: none; margin: 0; padding: 6px 8px; height: 104px; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px; font-size: 13px; }
  #log li { padding: 1px 0; border-bottom: 1px solid #ffffff0a; }
  #log .t { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 4px; }
  #log .who { font-weight: 700; }
  #log .event { color: var(--accent); font-weight: 600; }

  #mapWrap { position: relative; display: flex; justify-content: center; border-radius: 12px; overflow: hidden;
    box-shadow: 0 6px 24px #0008, inset 0 0 0 1px #ffffff10; }
  canvas { display: block; }
  #zoomBtns { position: absolute; right: 8px; bottom: 8px; display: flex; flex-direction: column; gap: 6px; }
  #zoomBtns button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid #ffffff22; background: #121a15cc;
    font-size: 20px; font-weight: 600; backdrop-filter: blur(4px); }
  .hint { text-align: center; color: var(--muted); font-size: 12px; margin: 8px 0 0; }

  #roster { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--border); font-size: 13px; }
  .chip.sel { border-color: var(--accent); background: var(--panel-2); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 2px solid #fff; flex: none; }
  .dot.big { width: 18px; height: 18px; }

  #inspector { margin-top: 10px; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; }
  .insp-head { display: flex; align-items: center; gap: 10px; }
  .insp-head b { font-size: 17px; }
  .tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px; }
  .tag { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: #ffffff12; color: var(--muted); }
  .mood { margin-left: auto; font-size: 26px; }
  .thought { margin: 10px 0 6px; padding: 8px 10px; background: #ffffff0d; border-radius: 10px; font-style: italic; }
  .doing { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .bars { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 14px; }
  .lbl { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .bar { height: 7px; background: #0005; border-radius: 4px; overflow: hidden; margin: 2px 0 5px; }
  .bar > i { display: block; height: 100%; transition: width .3s linear; }
  .sec { margin-top: 10px; font-size: 13px; }
  .sec h4 { margin: 0 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  .sec ul { margin: 0; padding-left: 18px; }
  .score, .rel { display: inline-flex; align-items: center; gap: 5px; margin: 0 6px 4px 0; padding: 2px 8px; border-radius: 8px; background: #ffffff0d; }
  .score.win { background: #f0b54a33; color: var(--accent); font-weight: 600; }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); font-size: 13px; text-align: center; margin: 4px 0; }
  footer { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; color: var(--muted); font-size: 12px; }
  footer button { height: 32px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="row">
      <div id="clock">Tag 1 · 06:00</div>
      <div class="ctrls" id="speed">
        <button data-speed="0" aria-label="Pause">⏸</button>
        <button data-speed="1" class="active">1x</button>
        <button data-speed="2">2x</button>
        <button data-speed="5">5x</button>
      </div>
    </div>
    <div id="stats"></div>
    <ol id="log" aria-live="polite"></ol>
  </header>

  <div id="mapWrap">
    <canvas id="map"></canvas>
    <button id="soundBtn" aria-label="Ton ein/aus">🔇</button>
    <div id="zoomBtns">
      <button data-z="1.25" aria-label="Hineinzoomen">+</button>
      <button data-z="0.8" aria-label="Herauszoomen">−</button>
      <button id="homeBtn" aria-label="Zum Lager">⌂</button>
    </div>
  </div>
  <p class="hint">Wischen = verschieben · zwei Finger = zoomen · Siedler antippen = Gedanken lesen</p>

  <section id="roster" aria-label="Siedler"></section>
  <section id="inspector" aria-live="polite"></section>

  <footer>
    <span id="seedInfo"></span>
    <span id="saveInfo"></span>
    <button id="newWorld">🌍 Neue Welt</button>
  </footer>
</div>

<script>
'use strict';

/* =====================================================================
 * 1) KONFIGURATION
 * Alle Spielwerte an einer Stelle. Neue Gebäude, Berufe usw. werden hier
 * ergänzt, ohne die Logik weiter unten umbauen zu müssen.
 * ===================================================================== */
const CONFIG = {
  map: { width: 24, height: 32 },
  time: {
    minutesPerSecond: 4,    // bei 1x: 1 echte Sekunde = 4 Spielminuten (1 Tag = 6 Minuten)
    startHour: 6,
    nightStart: 22,
    nightEnd: 6,
  },
  speeds: [0, 1, 2, 5],
  npc: {
    moveSpeed: 0.25,        // Kacheln pro Spielminute
    carryCapacity: 5,       // Holz, das ein NPC auf einmal tragen kann
    startHunger: 25,
    startEnergy: 90,
    hungerPerMin: 0.1,      // 0 = satt, 100 = am Verhungern
    energyPerMin: 0.06,     // Verbrauch im Wachzustand
    workEnergyPerMin: 0.04, // Zusatzverbrauch bei körperlicher Arbeit
    sleepEnergyPerMin: 0.22,
    houseSleepBonus: 1.5,   // schläft im Haus schneller aus
    eatThreshold: 55,       // ab hier wird gegessen
    criticalHunger: 85,     // ab hier wird alles andere unterbrochen
    tiredThreshold: 25,     // ab hier wird geschlafen
    criticalEnergy: 8,
    socialPerMin: 0.05,     // Bedürfnis nach Gesellschaft sinkt im Wachzustand
    nightSleepBelow: 95,    // nachts schlafen, wenn Energie darunter liegt
    wakeEnergy: 80,         // tagsüber aufwachen ab dieser Energie
  },
  resources: {
    treeWood: 4,
    chopMinutes: 15,        // Minuten pro Holz
    treeRegrowMinutes: 2 * 1440,
    bushMaxBerries: 6,
    berryRegrowMinutes: 80,
    eatMinutes: 5,          // Minuten pro Beere
    berryFood: 15,          // so viel Hunger stillt eine Beere
    bushCount: 16,
  },
  // Gebäudetypen. Später z. B. markt, schmiede, lager ...
  buildings: {
    house: { name: 'Haus', cost: { wood: 20 }, work: 240, beds: 2 },
  },
  // Berufe (Platzhalter): Gewichte multiplizieren die Aktions-Wertung.
  professions: {
    settler: { name: 'Siedler', weights: {} },
    // lumberjack: { name: 'Holzfäller', weights: { gatherWood: 1.6 } },
  },
  population: {
    max: 30,                // Obergrenze, damit es auf dem Handy flüssig bleibt
    names: ['Lina', 'Bjarn', 'Selma', 'Oskar', 'Ylva', 'Ruben', 'Nele', 'Kasimir', 'Ida', 'Jorin', 'Frieda', 'Emil',
      'Hanna', 'Levin', 'Talia', 'Arvid', 'Mila', 'Finn', 'Runa', 'Theo', 'Greta', 'Ansgar', 'Lotta', 'Malte', 'Svea', 'Jonte', 'Wilma', 'Henrik'],
  },
  startingNpcs: [
    { name: 'Mira',  color: '#f0a04b' },
    { name: 'Tarek', color: '#5fb6ef' },
  ],
  logSize: 80,
};

/* =====================================================================
 * 2) HILFSFUNKTIONEN
 * ===================================================================== */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pad2 = n => String(n).padStart(2, '0');
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

/* =====================================================================
 * 3) WELT: Kacheln, Kartengenerierung, Wegfindung, Nachwachsen
 * ===================================================================== */
const TILE_DEFS = {
  grass: { name: 'Wiese',        walkable: true  },
  tree:  { name: 'Wald',         walkable: false },
  stump: { name: 'Baumstumpf',   walkable: false },
  water: { name: 'Wasser',       walkable: false },
  bush:  { name: 'Beerenstrauch',walkable: false },
  camp:  { name: 'Lager',        walkable: false },
  site:  { name: 'Baustelle',    walkable: false },
  house: { name: 'Haus',         walkable: false },
};

class World {
  constructor(cfg, rng) {
    this.cfg = cfg;
    this.w = cfg.map.width;
    this.h = cfg.map.height;
    this.tiles = [];
    this.dirty = true; // Hintergrund muss neu gezeichnet werden
    this.dirtyTiles = new Set(); // geänderte Kacheln für den Boden-Zwischenspeicher
    this.camp = generateMap(this, rng);
  }
  inBounds(x, y) { return x >= 0 && y >= 0 && x < this.w && y < this.h; }
  tile(x, y) { return this.inBounds(x, y) ? this.tiles[y * this.w + x] : null; }
  walkable(x, y) { const t = this.tile(x, y); return !!t && TILE_DEFS[t.type].walkable; }
  setType(t, type) { t.type = type; t.timer = 0; this.dirty = true; this.dirtyTiles.add(t); }

  /**
   * Breitensuche ab (sx, sy) über begehbare Kacheln.
   * goal(x, y) liefert ein Ziel zurück (truthy), sobald (x, y) ein passender Standplatz ist.
   * Ergebnis: { path: [{x,y}...] ohne Startfeld, stand: {x,y}, target }
   */
  bfs(sx, sy, goal) {
    const start = { x: Math.round(sx), y: Math.round(sy) };
    if (!this.inBounds(start.x, start.y)) return null;
    const n = this.w * this.h;
    const prev = new Int32Array(n).fill(-2);
    const startIdx = start.y * this.w + start.x;
    prev[startIdx] = -1;
    const queue = [startIdx];
    for (let head = 0; head < queue.length; head++) {
      const idx = queue[head];
      const x = idx % this.w, y = (idx / this.w) | 0;
      const target = goal(x, y);
      if (target) {
        const path = [];
        for (let i = idx; i !== startIdx; i = prev[i]) path.push({ x: i % this.w, y: (i / this.w) | 0 });
        path.reverse();
        return { path, stand: { x, y }, target };
      }
      for (const [dx, dy] of DIRS) {
        const nx = x + dx, ny = y + dy;
        if (!this.walkable(nx, ny)) continue;
        const ni = ny * this.w + nx;
        if (prev[ni] !== -2) continue;
        prev[ni] = idx;
        queue.push(ni);
      }
    }
    return null;
  }

  /** Nächster Standplatz direkt neben einer Kachel, die isTarget(tile) erfüllt. */
  findAdjacent(sx, sy, isTarget) {
    return this.bfs(sx, sy, (x, y) => {
      for (const [dx, dy] of DIRS) {
        const t = this.tile(x + dx, y + dy);
        if (t && isTarget(t)) return t;
      }
      return null;
    });
  }

  /** Läuft jede Spielminute: Beeren und Bäume wachsen nach. */
  update() {
    const r = this.cfg.resources;
    for (const t of this.tiles) {
      if (t.type === 'bush' && t.berries < r.bushMaxBerries) {
        if (++t.timer >= r.berryRegrowMinutes) { t.berries++; t.timer = 0; this.dirty = true; }
      } else if (t.type === 'stump') {
        if (++t.timer >= r.treeRegrowMinutes) { this.setType(t, 'tree'); t.wood = r.treeWood; }
      }
    }
  }
}

function generateMap(world, rng) {
  const { w, h } = world;
  const r = world.cfg.resources;
  const ri = (a, b) => a + Math.floor(rng() * (b - a + 1));
  for (let y = 0; y < h; y++)
    for (let x = 0; x < w; x++)
      world.tiles.push({ x, y, type: 'grass', wood: 0, berries: 0, timer: 0, shade: rng(), building: null, traffic: 0 });

  const blob = (cx, cy, radius, type, density = 1) => {
    const R = Math.ceil(radius + 1);
    for (let y = cy - R; y <= cy + R; y++)
      for (let x = cx - R; x <= cx + R; x++) {
        const t = world.tile(x, y);
        if (!t) continue;
        const d = Math.hypot(x - cx, y - cy);
        if (d + rng() * 1.4 < radius && rng() < density) t.type = type;
      }
  };

  // Seen
  const lakes = 1 + (rng() < 0.6 ? 1 : 0);
  for (let i = 0; i < lakes; i++) blob(ri(2, w - 3), ri(2, h - 3), 2.5 + rng() * 2.5, 'water');
  // Wälder
  for (let i = 0; i < 8; i++) blob(ri(0, w - 1), ri(0, h - 1), 2 + rng() * 2.5, 'tree', 0.8);

  // Lichtung mit Lager in der Mitte
  const camp = { x: Math.floor(w / 2), y: Math.floor(h / 2) };
  for (let y = camp.y - 4; y <= camp.y + 4; y++)
    for (let x = camp.x - 4; x <= camp.x + 4; x++) {
      const t = world.tile(x, y);
      if (t && Math.hypot(x - camp.x, y - camp.y) <= 3.6) t.type = 'grass';
    }
  world.tile(camp.x, camp.y).type = 'camp';

  // Ein paar Bäume garantiert in Reichweite
  for (let i = 0; i < 3; i++) {
    const a = rng() * Math.PI * 2;
    blob(Math.round(camp.x + Math.cos(a) * 7), Math.round(camp.y + Math.sin(a) * 7), 1.8, 'tree', 0.9);
  }

  // Beerensträucher: einige nah am Lager, der Rest verstreut
  let placed = 0, tries = 0;
  while (placed < r.bushCount && tries++ < 2000) {
    let x, y;
    if (placed < 5) {
      const a = rng() * Math.PI * 2, d = 4 + rng() * 3;
      x = Math.round(camp.x + Math.cos(a) * d); y = Math.round(camp.y + Math.sin(a) * d);
    } else { x = ri(0, w - 1); y = ri(0, h - 1); }
    const t = world.tile(x, y);
    if (!t || t.type !== 'grass' || Math.hypot(x - camp.x, y - camp.y) < 3) continue;
    t.type = 'bush'; placed++;
  }

  for (const t of world.tiles) {
    if (t.type === 'tree') t.wood = r.treeWood;
    if (t.type === 'bush') t.berries = r.bushMaxBerries;
  }
  return camp;
}

/* =====================================================================
 * 4) SIEDLUNG: Lager, Gebäude, Baustellen
 * ===================================================================== */
class Settlement {
  constructor(sim, camp) {
    this.sim = sim;
    this.camp = camp;
    this.stock = { wood: 0 };   // später: food, stone, coins ...
    this.buildings = [];
    this.site = null;           // aktuelle Baustelle
  }
  get houses() { return this.buildings.filter(b => b.type === 'house'); }
  canAfford(cost) { return Object.entries(cost).every(([k, v]) => (this.stock[k] || 0) >= v); }
  pay(cost) { for (const [k, v] of Object.entries(cost)) this.stock[k] -= v; }

  update() {
    // Einfache Bauplanung: genug Holz im Lager → nächstes Haus beginnen.
    if (!this.site && this.canAfford(CONFIG.buildings.house.cost)) this.startConstruction('house');
  }

  startConstruction(type) {
    const def = CONFIG.buildings[type];
    const tile = this.findBuildSpot();
    if (!tile) return false;
    this.pay(def.cost);
    this.sim.world.setType(tile, 'site');
    this.site = { type, tile, progress: 0, work: def.work };
    this.sim.log(`🪓 ${def.cost.wood} Holz beisammen – die Siedler bauen gemeinsam ein ${def.name}!`, null, true);
    this.sim.emit('constructionStarted', this.site);
    return true;
  }

  completeSite() {
    const site = this.site;
    const def = CONFIG.buildings[site.type];
    this.sim.world.setType(site.tile, site.type);
    const b = { id: this.buildings.length + 1, type: site.type, tile: site.tile, beds: def.beds || 0, sleepers: new Set(), residents: [] };
    site.tile.building = b;
    this.buildings.push(b);
    this.site = null;
    this.sim.log(`🏠 ${def.name} Nr. ${this.houses.length} ist fertig!`, null, true);
    this.sim.float(site.tile.x, site.tile.y, '🎉 Fertig!', '#f0b54a');
    for (const n of this.sim.npcs) if (n.task && n.task.actionId === 'build') n.remember(this.sim, `Hat Haus Nr. ${b.id} mitgebaut 🔨`);
    this.sim.emit('buildingCompleted', b);
  }

  /** Sucht freie Wiese nahe am Lager. Raster mit Abstand 2 hält Wege frei. */
  findBuildSpot() {
    const { world, npcs } = this.sim;
    const c = this.camp;
    let best = null, bestD = Infinity;
    for (let y = 0; y < world.h; y++)
      for (let x = 0; x < world.w; x++) {
        const dx = x - c.x, dy = y - c.y;
        if (dx % 2 !== 0 || dy % 2 !== 0 || (dx === 0 && dy === 0)) continue;
        const t = world.tile(x, y);
        if (t.type !== 'grass') continue;
        if (npcs.some(n => Math.round(n.x) === x && Math.round(n.y) === y)) continue;
        if (!DIRS.some(([ax, ay]) => world.walkable(x + ax, y + ay))) continue;
        const d = Math.hypot(dx, dy * 1.1);
        if (d < bestD && world.bfs(c.x, c.y + 1, (px, py) => Math.abs(px - x) + Math.abs(py - y) === 1)) {
          best = t; bestD = d;
        }
      }
    return best;
  }
}

/* =====================================================================
 * 5) AKTIONEN (Utility-KI)
 * Jede Aktion bewertet sich selbst (score), erklärt ihre Absicht (think)
 * und plant Schritte (move / act). Neue Tätigkeiten = weitere defineAction.
 * ===================================================================== */
const ACTIONS = {};
function defineAction(def) { ACTIONS[def.id] = { interruptible: true, ...def }; }

const move = path => ({ kind: 'move', path });
const act = (tick, opts = {}) => ({ kind: 'act', tick, t: 0, ...opts });
const pick = (sim, arr) => arr[Math.floor(sim.rng() * arr.length)];
const houseCost = () => CONFIG.buildings.house.cost.wood;
const woodCarried = sim => sim.npcs.reduce((a, n) => a + n.inventory.wood, 0);

defineAction({
  id: 'eat', label: 'isst Beeren', short: 'Essen', start: 'geht Beeren essen', icon: '🫐',
  interruptible: false,
  score(n, sim) {
    if (n.hunger >= CONFIG.npc.eatThreshold) return 50 + n.hunger * 0.5;
    const h = sim.hourFloat;
    if (h >= 20 && h < 22 && n.hunger >= 35) return 68; // vorausplanen: vor dem Schlafen noch essen
    return 0;
  },
  urgent: n => n.hunger >= CONFIG.npc.criticalHunger,
  think: (n, sim) => n.hunger >= CONFIG.npc.eatThreshold
    ? pick(sim, [`Mein Magen knurrt (Hunger ${Math.round(n.hunger)}). Zeit für Beeren.`, 'Erst essen, dann weiterarbeiten.', 'Ich brauche etwas zu essen, sonst schaffe ich nichts.'])
    : 'Ich esse lieber jetzt noch etwas, bevor ich schlafen gehe.',
  plan(n, sim) {
    const res = sim.world.findAdjacent(n.x, n.y, t => t.type === 'bush' && t.berries > 0);
    if (!res) return null;
    const bush = res.target;
    return [move(res.path), act((n, sim, s) => {
      if (s.t % CONFIG.resources.eatMinutes !== 0) return;
      if (bush.type !== 'bush' || bush.berries <= 0) return 'done';
      bush.berries--; bush.timer = 0;
      n.hunger = Math.max(0, n.hunger - CONFIG.resources.berryFood);
      sim.float(bush.x, bush.y, '😋', '#fff');
      n.gainXp('gathering', 1);
      if (n.hunger <= 5) return 'done';
    }, { face: bush })];
  },
});

defineAction({
  id: 'sleep', label: 'schläft', short: 'Schlafen', start: 'legt sich schlafen', icon: '💤',
  score(n, sim) {
    const c = CONFIG.npc;
    if (n.energy < c.tiredThreshold) return 60 + (100 - n.energy) * 0.4;
    if (sim.isNight && n.energy < c.nightSleepBelow) return 65;
    return 0;
  },
  urgent: n => n.energy <= CONFIG.npc.criticalEnergy,
  think(n, sim) {
    if (n.energy < CONFIG.npc.tiredThreshold && !sim.isNight) return 'Ich bin völlig erschöpft, ich muss mich hinlegen.';
    if (n.bed && n.bed === n.home) return `Es ist spät. Ab nach Hause in Haus Nr. ${n.bed.id}.`;
    if (n.bed) return `Ich darf heute in Haus Nr. ${n.bed.id} übernachten.`;
    return 'Noch kein Dach über dem Kopf … ich schlafe am Lagerfeuer.';
  },
  plan(n, sim) {
    const free = h => h.sleepers.size < h.beds;
    const house = n.home && free(n.home) ? n.home : sim.settlement.houses.find(free);
    const steps = [];
    if (house) {
      const res = sim.world.findAdjacent(n.x, n.y, t => t === house.tile);
      if (res) { steps.push(move(res.path)); house.sleepers.add(n); n.bed = house; }
    }
    if (!n.bed) { // ohne Haus: ans Lagerfeuer
      const res = sim.world.findAdjacent(n.x, n.y, t => t.type === 'camp');
      if (res && res.path.length < 40) steps.push(move(res.path));
    }
    steps.push(act((n, sim) => {
      n.sleeping = true;
      n.inside = n.bed;
      const c = CONFIG.npc;
      n.energy = Math.min(100, n.energy + c.sleepEnergyPerMin * (n.bed ? c.houseSleepBonus : 1));
      if (!sim.isNight && n.energy >= c.wakeEnergy) return 'done';
    }));
    return steps;
  },
  describe: n => n.bed ? `geht ins Haus Nr. ${n.bed.id} schlafen` : 'schläft am Lagerfeuer',
  onEnd(n) {
    if (n.bed) n.bed.sleepers.delete(n);
    n.bed = null; n.inside = null; n.sleeping = false;
  },
});

defineAction({
  id: 'build', label: 'baut am Haus', short: 'Bauen', start: 'hilft beim Hausbau', icon: '🔨',
  score: (n, sim) => sim.settlement.site ? 50 : 0,
  think(n, sim) {
    const site = sim.settlement.site;
    const p = site ? Math.floor(site.progress / site.work * 100) : 0;
    const helpers = sim.npcs.filter(o => o !== n && o.task && o.task.actionId === 'build').length;
    return helpers ? `${helpers} ${helpers === 1 ? 'andere baut' : 'andere bauen'} schon, ich packe mit an! (${p} %)` : `Das neue Haus ist zu ${p} % fertig. Ich baue weiter.`;
  },
  plan(n, sim) {
    const site = sim.settlement.site;
    const res = sim.world.findAdjacent(n.x, n.y, t => t === site.tile);
    if (!res) return null;
    return [move(res.path), act((n, sim) => {
      if (sim.settlement.site !== site) return 'done';
      site.progress += n.workRate('build');
      n.gainXp('building', 1);
      if (site.progress >= site.work) { sim.settlement.completeSite(); return 'done'; }
    }, { work: true, face: site.tile })];
  },
});

defineAction({
  id: 'deliver', label: 'bringt Holz ins Lager', short: 'Abliefern', start: 'bringt Holz zum Lager', icon: '📦',
  score(n, sim) {
    const w = n.inventory.wood;
    if (w >= CONFIG.npc.carryCapacity) return 45;
    if (w > 0 && !sim.settlement.site && sim.settlement.stock.wood + w >= houseCost()) return 48; // reicht schon fürs Haus

  },
  think(n, sim) {

    return [move(res.path), act((n, sim) => {

      sim.settlement.stock.wood += amount;
      n.inventory.wood = 0;
      sim.float(sim.settlement.camp.x, sim.settlement.camp.y, `+${amount} 🪵`, '#f0b54a');

defineAction({
  id: 'gatherWood', label: 'hackt Holz', short: 'Holz', start: 'geht Holz hacken', icon: '🪓',
  score: (n, sim) => n.inventory.wood < CONFIG.npc.carryCapacity ? 30 + (sim.settlement.stock.wood >= houseCost() * 0.6 ? 4 : 0) : 0,
  think(n, sim) {
    const need = Math.max(0, houseCost() - sim.settlement.stock.wood - woodCarried(sim));
    if (sim.settlement.site) return 'Fürs übernächste Haus brauchen wir auch Holz.';
    if (need === 0) return 'Wir haben genug Holz für das nächste Haus! Ich sammle schon mal vor.';
    if (need <= 5) return `Nur noch ${need} Holz, dann können wir bauen!`;
    if (n.traits.fleiss > 0.65) return pick(sim, ['Arbeit macht mir Spaß. Ich hole Holz.', `Noch ${need} Holz bis zum nächsten Haus, packen wir's an.`]);
    return `Das Lager braucht noch ${need} Holz.`;
  },
  plan(n, sim) {
    const res = sim.world.findAdjacent(n.x, n.y, t => t.type === 'tree' && t.wood > 0);
    if (!res) return null;

      if (s.t % Math.max(1, Math.round(CONFIG.resources.chopMinutes / n.workRate('chop'))) !== 0) return;
      tree.wood--;
      sim.float(tree.x, tree.y, '+1 🪵', '#f3d29b');
      sim.emit('chop', tree);
      n.inventory.wood++;
      n.gainXp('woodcutting', 1);
      if (tree.wood <= 0) sim.world.setType(tree, 'stump');
      if (n.inventory.wood >= CONFIG.npc.carryCapacity || tree.type !== 'tree') return 'done';
    }, { work: true, face: tree })];
  },
});

defineAction({
  id: 'socialize', label: 'unterhält sich', short: 'Reden', start: 'sucht Gesellschaft', icon: '💬',
  score(n, sim) {
    const need = 100 - n.social;
    if (need < 35 || sim.isNight) return 0;
    const h = sim.hourFloat;
    return need * 0.55 * (0.6 + n.traits.gesellig * 0.8) + (h >= 17 && h < 21 ? 10 : 0);
  },
  think: (n, sim) => n.partner
    ? ((n.relations[n.partner.id] || 0) >= 50 ? `Ich will mit ${n.partner.name} reden – wir sind befreundet.` : `Ich fühle mich etwas einsam. Mal sehen, wie es ${n.partner.name} geht.`)
    : 'Ich brauche Gesellschaft.',
  plan(n, sim) {
    const partner = choosePartner(n, sim);
    if (!partner) return null;
    const pt = sim.world.tile(Math.round(partner.x), Math.round(partner.y));
    const res = sim.world.findAdjacent(n.x, n.y, t => t === pt);
    if (!res || res.path.length > 30) return null;
    n.partner = partner;
    return [move(res.path), act((n, sim, s) => {
      if (Math.hypot(partner.x - n.x, partner.y - n.y) > 2.2 || partner.sleeping || partner.inside) return 'done';
      if (s.t === 1) converse(n, partner, sim);
      n.social = Math.min(100, n.social + 2.5);
      partner.social = Math.min(100, partner.social + 1.2);
      changeRelation(n, partner, 0.6, sim);
      if (s.t >= 20 || n.social >= 98) return 'done';
    }, { face: partner })];
  },
  onEnd(n) { n.partner = null; },
});

/* ---- Soziales: Gesprächspartner, Gespräche, Beziehungen ---------------- */
function choosePartner(n, sim) {
  let best = null, bestScore = -Infinity;
  for (const o of sim.npcs) {
    if (o === n || o.sleeping || o.inside || (o.task && o.task.actionId === 'arrive')) continue;
    const d = Math.hypot(o.x - n.x, o.y - n.y);
    if (d > 18) continue;
    const sc = (n.relations[o.id] || 0) * 0.6 + 20 - d * 2 + sim.rng() * 12;
    if (sc > bestScore) { bestScore = sc; best = o; }
  }
  return best;
}

function dialogue(a, b, sim) {
  const st = sim.settlement, need = houseCost() - st.stock.wood, rel = a.relations[b.id] || 0;
  const L = [];
  if (b.arrivedAt && sim.minutes - b.arrivedAt < 1440) L.push(`Willkommen in unserer Siedlung, ${b.name}!`, `Hast du dich schon eingelebt, ${b.name}?`);
  if (st.site) L.push(`Das neue Haus ist schon zu ${Math.floor(st.site.progress / st.site.work * 100)} % fertig!`);
  else if (need > 0) L.push(`Uns fehlen noch ${need} Holz fürs nächste Haus.`, 'Wenn wir so weitermachen, steht bald das nächste Haus.');
  if (a.hunger > 45) L.push('Ich könnte jetzt einen ganzen Strauch Beeren essen.');
  if (a.energy < 35) L.push('Ich bin hundemüde …');
  if (sim.weather === 'regen') L.push('Dieser Regen hört gar nicht auf.', 'Gut für die Beeren, schlecht für meine Laune.');
  if (sim.weather === 'klar' && !sim.isNight) L.push('Herrliches Wetter heute, oder?');
  if (a.home && a.home === b.home) L.push('Schön, dass wir unter einem Dach wohnen.');
  if (!a.home) L.push('Ich hoffe, ich bekomme bald ein eigenes Haus.');
  if (rel >= 50) L.push(`Auf dich kann man sich verlassen, ${b.name}.`, 'Weißt du noch, wie klein hier alles angefangen hat?');
  if (rel < 10) L.push(`Wir kennen uns noch kaum. Ich bin ${a.name}.`);
  if (sim.npcs.length >= 6) L.push(`Wir sind schon ${sim.npcs.length} Leute hier!`, 'Vielleicht sollten wir bald einen Markt bauen.');
  if ((a.skills.woodcutting || 0) >= 30) L.push(`Ich habe schon ${a.skills.woodcutting} Holz geschlagen.`);
  if (a.traits.neugier > 0.65) L.push('Was wohl hinter dem großen Wald liegt?');
  return pick(sim, L.length ? L : ['Na, alles gut bei dir?']);
}

function converse(a, b, sim) {
  const line = dialogue(a, b, sim);
  sim.log(`💬 zu ${b.name}: „${line}“`, a);
  b.thought = `${a.name} sagt: „${line}“`;
}

function changeRelation(a, b, d, sim) {
  for (const [x, y] of [[a, b], [b, a]]) {
    const before = x.relations[y.id] || 0;
    x.relations[y.id] = clamp(before + d, -100, 100);
    if (x === a && before < 50 && x.relations[y.id] >= 50) {
      sim.log(`🤝 ${a.name} und ${b.name} sind jetzt Freunde!`, null, true);
      a.remember(sim, `Hat sich mit ${b.name} angefreundet 🤝`);
      b.remember(sim, `Hat sich mit ${a.name} angefreundet 🤝`);
    }
  }
}

/* =====================================================================
 * 6) NPC: Bedürfnisse, Charakter, Gedanken, Entscheidungen
 * ===================================================================== */
function traitTags(t) {
  const tags = [];
  if (t.fleiss > 0.65) tags.push('fleißig'); else if (t.fleiss < 0.35) tags.push('gemütlich');
  if (t.gesellig > 0.65) tags.push('gesellig'); else if (t.gesellig < 0.35) tags.push('Einzelgänger');
  if (t.neugier > 0.65) tags.push('neugierig');
  return tags.length ? tags : ['ausgeglichen'];
}

class NPC {
  constructor(id, def, x, y, rng = Math.random) {
    this.id = id;
    this.name = def.name;
    this.color = def.color;
    this.x = x; this.y = y; this.prevX = x; this.prevY = y;
    this.hunger = CONFIG.npc.startHunger;
    this.energy = CONFIG.npc.startEnergy;
    this.inventory = { wood: 0 };  // später: food, coins, weapon ...
    this.profession = 'settler';
    this.home = null;
    this.skills = {};              // Erfahrung je Tätigkeit → Grundlage fürs Level-System
    this.traits = def.traits || { fleiss: rng(), gesellig: rng(), neugier: rng() };
    this.mood = 70;                // Laune 0..100
    this.social = 75;              // Gemeinschaft 0..100 (100 = zufrieden)
    this.relations = {};           // id → -100..100
    this.memories = [];
    this.thought = '';
    this.lastScores = [];          // Abwägung der letzten Entscheidung
    this.partner = null;
    this.task = null;
    this.lastLogged = null;
    this.facing = 1;
    this.arrivedAt = 0;
    this.sleeping = false; this.inside = null; this.bed = null; this.working = false;
  }

  get action() { return this.task ? ACTIONS[this.task.actionId] : null; }
  get tags() { return traitTags(this.traits); }
  get moodEmoji() { const m = this.mood; return m >= 75 ? '😄' : m >= 55 ? '🙂' : m >= 35 ? '😐' : '😟'; }

  remember(sim, text) {
    this.memories.unshift({ day: sim.day, clock: sim.clock, text });
    if (this.memories.length > 8) this.memories.pop();
  }

  // --- Erweiterungspunkte -------------------------------------------
  gainXp(skill, amount) { this.skills[skill] = (this.skills[skill] || 0) + amount; }
  /** Arbeitsgeschwindigkeit; später abhängig von Level, Beruf, Werkzeug. */
  workRate(/* kind */) { return 1; }
  /** Beruf und Charakter gewichten Aktionen. */
  weight(actionId) {
    let w = CONFIG.professions[this.profession]?.weights?.[actionId] ?? 1;
    if (actionId === 'gatherWood' || actionId === 'build' || actionId === 'deliver') w *= 0.75 + this.traits.fleiss * 0.5;
    if (actionId === 'wander' || actionId === 'idle') w *= 1.6 - this.traits.fleiss;
    return w;
  }
  // ------------------------------------------------------------------

  update(sim) {
    this.prevX = this.x; this.prevY = this.y;
    this.updateNeeds(sim);

    // Dringende Bedürfnisse unterbrechen die aktuelle Tätigkeit
    if (this.task && this.action.interruptible) {
      const urgent = Object.values(ACTIONS).find(a => a.urgent && a.id !== this.task.actionId && a.urgent(this, sim));
      if (urgent) {
        const steps = urgent.plan(this, sim);
        if (steps) { this.endTask(sim); this.startTask(urgent, steps, sim); }
      }
    }
    if (!this.task) this.decide(sim);
    if (this.task) this.runTask(sim);
  }

  updateNeeds(sim) {
    const c = CONFIG.npc;
    this.hunger = clamp(this.hunger + c.hungerPerMin * (this.sleeping ? 0.5 : 1), 0, 100);
    if (!this.sleeping) {
      this.energy = clamp(this.energy - c.energyPerMin - (this.working ? c.workEnergyPerMin : 0), 0, 100);
      this.social = clamp(this.social - c.socialPerMin * (0.5 + this.traits.gesellig), 0, 100);
    }
    const target = clamp(100 - this.hunger * 0.45 - (100 - this.energy) * 0.25 - (100 - this.social) * 0.3
      + (this.home ? 8 : -8) - (sim.weather === 'regen' ? 8 : 0), 0, 100);
    this.mood += (target - this.mood) * 0.02;
    if (this.hunger >= 100 && !this.starving) { this.starving = true; sim.log('hat schrecklichen Hunger!', this); this.remember(sim, 'Hatte schrecklichen Hunger 😣'); }
    if (this.hunger < 90) this.starving = false;
  }

  decide(sim) {
    const ranked = Object.values(ACTIONS)
      .map(a => ({ a, s: a.score(this, sim) * this.weight(a.id) }))
      .filter(e => e.s > 0)
      .sort((p, q) => q.s - p.s);
    this.lastScores = ranked.slice(0, 3).map(e => ({ label: e.a.short || e.a.label, score: Math.round(e.s) }));
    for (const { a } of ranked) if (this.tryStart(a, sim)) return;
  }

  tryStart(action, sim) {
    const steps = action.plan(this, sim);
    if (!steps) return false;
    this.startTask(action, steps, sim);
    return true;
  }

  startTask(action, steps, sim) {
    this.task = { actionId: action.id, steps, i: 0 };
    this.thought = action.think ? action.think(this, sim) : action.start;
    if (action.id !== this.lastLogged) {
      sim.log(action.describe ? action.describe(this, sim) : action.start, this);
      this.lastLogged = action.id;
    }
  }

  runTask(sim) {
    const task = this.task;
    const step = task.steps[task.i];
    if (!step) return this.endTask(sim);
    this.working = false;
    let result;
    if (step.kind === 'move') result = this.moveAlong(step, sim);
    else { step.t++; this.working = !!step.work; result = step.tick(this, sim, step); }
    if (result === 'done') { task.i++; if (task.i >= task.steps.length) this.endTask(sim); }
    else if (result === 'fail') this.endTask(sim);
  }

  moveAlong(step, sim) {
    let budget = CONFIG.npc.moveSpeed;
    while (budget > 0 && step.path.length) {
      const next = step.path[0];
      if (!sim.world.walkable(next.x, next.y)) return 'fail'; // Weg verbaut → neu planen
      const dx = next.x - this.x, dy = next.y - this.y, d = Math.hypot(dx, dy);
      if (Math.abs(dx) > 0.01) this.facing = dx > 0 ? 1 : -1;
      if (d <= budget) {
        this.x = next.x; this.y = next.y; budget -= d; step.path.shift();
        const t = sim.world.tile(next.x, next.y);
        if (t.traffic < 400) { t.traffic++; if (t.traffic % 8 === 0 && t.traffic <= 64) sim.world.dirtyTiles.add(t); } // Trampelpfade
      } else { this.x += dx / d * budget; this.y += dy / d * budget; budget = 0; }
    }
    return step.path.length ? undefined : 'done';
  }

  endTask(sim) {
    const a = this.action;
    if (a && a.onEnd) a.onEnd(this, sim);
    this.task = null; this.working = false;
  }

  get statusText() {
    const a = this.action;
    if (!a) return 'überlegt …';
    const step = this.task.steps[this.task.i];
    if (step && step.kind === 'move' && a.id !== 'wander') return a.describe ? a.describe(this) : a.start;
    if (a.id === 'socialize' && this.partner) return `unterhält sich mit ${this.partner.name}`;
    return a.label;
  }
}

/* =====================================================================
 * 7) SIMULATION: Zeit, Wetter, Wachstum, Ereignisse, Log, Speichern
 * ===================================================================== */
const TILE_TYPES = Object.keys(TILE_DEFS);
const WEATHER_TEXT = { 'bewölkt': '☁️ Wolken ziehen auf.', regen: '🌧️ Es beginnt zu regnen.', klar: '🌤️ Der Himmel klart auf.' };

class Simulation {
  constructor(seed, save = null) {
    this.seed = seed;
    this.rng = mulberry32(seed);
    this.minutes = CONFIG.time.startHour * 60;
    this.weather = 'klar';
    this.world = new World(CONFIG, this.rng);
    this.settlement = new Settlement(this, this.world.camp);
    this.npcs = [];
    this.logEntries = [];
    this.floats = [];   // schwebende Texte, nur Anzeige
    this.listeners = {};
    if (save) this.applySave(save);
    else CONFIG.startingNpcs.forEach(def => this.addNpc(def));
    this.on('buildingCompleted', b => this.onHouseBuilt(b));
  }

  get day() { return Math.floor(this.minutes / 1440) + 1; }
  get hourFloat() { return (this.minutes % 1440) / 60; }
  get isNight() { const h = this.hourFloat; return h >= CONFIG.time.nightStart || h < CONFIG.time.nightEnd; }
  get clock() { const m = this.minutes % 1440; return `${pad2(Math.floor(m / 60))}:${pad2(m % 60)}`; }

  addNpc(def, pos = null) {
    const c = this.world.camp;
    const spot = pos ? { stand: pos } : this.world.bfs(c.x, c.y + 1, (x, y) =>
      Math.abs(x - c.x) + Math.abs(y - c.y) >= 1 && !this.npcs.some(n => n.x === x && n.y === y) ? true : null);
    const x = spot ? spot.stand.x : c.x, y = spot ? spot.stand.y : c.y + 1;
    const id = this.npcs.reduce((m, n) => Math.max(m, n.id), 0) + 1;
    const npc = new NPC(id, def, x, y, this.rng);
    this.npcs.push(npc);
    this.emit('npcAdded', npc);
    return npc;
  }

  /** Neues Haus: Siedler ohne Zuhause ziehen ein, danach kommt ein Neuer dazu. */
  onHouseBuilt(house) {
    if (house.type !== 'house') return;
    for (const n of this.npcs) if (!n.home && house.residents.length < house.beds) this.moveIn(n, house);
    if (this.npcs.length < CONFIG.population.max) this.spawnNewcomer();
  }

  moveIn(n, house, silent = false) {
    house.residents.push(n); n.home = house;
    if (!silent) n.remember(this, `Ist in Haus Nr. ${house.id} eingezogen 🏠`);
  }

  spawnNewcomer() {
    const entry = this.findEntryTile();
    if (!entry) return;
    const used = new Set(this.npcs.map(n => n.name));
    const name = CONFIG.population.names.find(x => !used.has(x)) || `Siedler ${this.npcs.length + 1}`;
    const color = `hsl(${Math.round((this.npcs.length * 137.5) % 360)}, 62%, 58%)`;
    const npc = this.addNpc({ name, color }, entry);
    npc.hunger = 20 + this.rng() * 20; npc.energy = 70 + this.rng() * 20;
    npc.arrivedAt = this.minutes;
    npc.remember(this, 'Ist in die Siedlung gekommen 🧳');
    const house = this.settlement.houses.find(h => h.residents.length < h.beds);
    if (house) this.moveIn(npc, house);
    this.log(`🧳 kommt neu in die Siedlung${house ? ` und zieht in Haus Nr. ${house.id} ein` : ''}!`, npc, true);
    this.float(entry.x, entry.y, '👋 Neu!', '#fff');
    npc.lastLogged = 'arrive';
    npc.tryStart(ACTIONS.arrive, this);
  }

  /** Zufälliges begehbares Randfeld mit Weg zum Lager. */
  findEntryTile() {
    const { w, h, camp: c } = this.world;
    const edges = [];
    for (let x = 0; x < w; x++) edges.push([x, 0], [x, h - 1]);
    for (let y = 1; y < h - 1; y++) edges.push([0, y], [w - 1, y]);
    for (let i = edges.length - 1; i > 0; i--) { const j = Math.floor(this.rng() * (i + 1)); [edges[i], edges[j]] = [edges[j], edges[i]]; }
    for (const [x, y] of edges)
      if (this.world.walkable(x, y) && this.world.bfs(x, y, (px, py) => Math.abs(px - c.x) + Math.abs(py - c.y) === 1)) return { x, y };
    return null;
  }

  updateWeather() {
    const r = this.rng(), w = this.weather;
    let next = w;
    if (w === 'klar' && r < 0.1) next = 'bewölkt';
    else if (w === 'bewölkt') next = r < 0.22 ? 'regen' : r < 0.5 ? 'klar' : w;
    else if (w === 'regen' && r < 0.35) next = 'bewölkt';
    if (next !== w) { this.weather = next; this.log(WEATHER_TEXT[next], null, true); }
  }

  on(evt, fn) { (this.listeners[evt] ||= []).push(fn); }
  emit(evt, data) { (this.listeners[evt] || []).forEach(fn => fn(data, this)); }

  float(x, y, text, color = '#fff') {
    if (this.floats.length < 40) this.floats.push({ x, y, text, color, born: performance.now() });
  }

  log(text, npc = null, event = false) {
    const entry = { day: this.day, clock: this.clock, text, npc, event };
    this.logEntries.unshift(entry);
    if (this.logEntries.length > CONFIG.logSize) this.logEntries.pop();
    this.emit('log', entry);
  }

  /** Eine Spielminute. */
  step() {
    this.minutes++;
    if (this.minutes % 1440 === 0) this.log(`🌅 Tag ${this.day} beginnt.`, null, true);
    if (this.minutes % 60 === 0) this.updateWeather();
    this.world.update(this);
    this.settlement.update(this);
    for (const npc of this.npcs) npc.update(this);
  }

  // --- Speichern / Laden ---------------------------------------------
  serialize() {
    const st = this.settlement;
    return {
      v: 1, seed: this.seed, minutes: this.minutes, weather: this.weather,
      tiles: this.world.tiles.map(t => [TILE_TYPES.indexOf(t.type), t.wood, t.berries, t.timer, t.traffic]),
      stock: st.stock,
      buildings: st.buildings.map(b => ({ id: b.id, type: b.type, x: b.tile.x, y: b.tile.y })),
      site: st.site && { type: st.site.type, x: st.site.tile.x, y: st.site.tile.y, progress: st.site.progress, work: st.site.work },
      npcs: this.npcs.map(n => ({
        id: n.id, name: n.name, color: n.color, x: Math.round(n.x), y: Math.round(n.y),
        hunger: n.hunger, energy: n.energy, inventory: n.inventory, skills: n.skills, traits: n.traits,
        mood: n.mood, social: n.social, relations: n.relations, memories: n.memories,
        home: n.home ? n.home.id : null, profession: n.profession, facing: n.facing, arrivedAt: n.arrivedAt,
      })),
      log: this.logEntries.slice(0, 30).map(e => ({ day: e.day, clock: e.clock, text: e.text, event: e.event, npc: e.npc ? e.npc.id : null })),
    };
  }

  applySave(d) {
    const w = this.world, st = this.settlement;
    this.minutes = d.minutes;
    this.weather = d.weather || 'klar';
    this.rng = mulberry32((this.seed ^ d.minutes) >>> 0);
    d.tiles.forEach((a, i) => {
      const t = w.tiles[i];
      t.type = TILE_TYPES[a[0]] || 'grass'; t.wood = a[1]; t.berries = a[2]; t.timer = a[3]; t.traffic = a[4] || 0; t.building = null;
    });
    st.stock = { ...st.stock, ...d.stock };
    for (const b of d.buildings) {
      const tile = w.tile(b.x, b.y), def = CONFIG.buildings[b.type];
      const bb = { id: b.id, type: b.type, tile, beds: def.beds || 0, sleepers: new Set(), residents: [] };
      tile.building = bb; st.buildings.push(bb);
    }
    if (d.site) st.site = { type: d.site.type, tile: w.tile(d.site.x, d.site.y), progress: d.site.progress, work: d.site.work };
    for (const s of d.npcs) {
      const spot = w.bfs(s.x, s.y, (x, y) => w.walkable(x, y));
      const pos = spot ? spot.stand : { x: s.x, y: s.y };
      const n = new NPC(s.id, { name: s.name, color: s.color, traits: s.traits }, pos.x, pos.y, this.rng);
      Object.assign(n, {
        hunger: s.hunger, energy: s.energy, inventory: s.inventory || { wood: 0 }, skills: s.skills || {},
        mood: s.mood ?? 70, social: s.social ?? 70, relations: s.relations || {}, memories: s.memories || [],
        profession: s.profession || 'settler', facing: s.facing || 1, arrivedAt: s.arrivedAt || 0,
      });
      if (s.home != null) { const h = st.buildings.find(b => b.id === s.home); if (h) this.moveIn(n, h, true); }
      this.npcs.push(n);
    }
    this.logEntries = (d.log || []).map(e => ({ ...e, npc: this.npcs.find(n => n.id === e.npc) || null }));
    w.dirty = true;
  }
}

/* =====================================================================
 * 8) DARSTELLUNG (Canvas 2D)
 * Pipeline pro Bild: Boden (zwischengespeichert) → Wasseranimation →
 * Sonnenschatten → Objekte & Siedler (Reihe für Reihe) → Partikel →
 * Wolkenschatten → Regen → Farbstimmung → Nacht-Lichtkarte → Leuchten →
 * Beschriftung → Vignette.
 * Bäume und Häuser werden einmal pro Zoomstufe als Sprites vorgerendert.
 * ===================================================================== */
const SKIN = ['#f1c7a0', '#e0ac7e', '#c68a5c', '#8d5a3b', '#f5d3b8'];
const HAIR = ['#3b2a1e', '#8a4b22', '#d9b25f', '#1d1d1d', '#b5532a', '#6b6b6b'];
const ROOFS = ['#a8432f', '#7d4a2b', '#56606e', '#8e3d55'];
const SHUTTERS = ['#4f6b5a', '#6b5a4f', '#4f5f6b', '#6b4f5a'];
const BERRY_SPOTS = [[-0.2, -0.24], [0.17, -0.3], [0.02, -0.16], [-0.07, -0.44], [0.25, -0.17], [0.07, -0.5]];
const TAU = Math.PI * 2;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const rand = (a, b) => a + Math.random() * (b - a);
function shadeHex(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = v => clamp(v + amt, 0, 255);
  return `rgb(${f(n >> 16)}, ${f((n >> 8) & 255)}, ${f(n & 255)})`;
}

/* ---- Sprite-Zeichnungen (Ursprung = Fußpunkt, y nach oben negativ) ---- */
function drawCanopy(c, s, blobs, hue, L, rng) {
  c.fillStyle = `hsl(${hue}, 38%, ${L - 14}%)`;
  for (const [x, y, r] of blobs) { c.beginPath(); c.arc(x * s, (y + 0.05) * s, r * s, 0, TAU); c.fill(); }
  for (const [x, y, r] of blobs) {
    const g = c.createRadialGradient((x - r * 0.35) * s, (y - r * 0.4) * s, r * 0.1 * s, x * s, y * s, r * s);
    g.addColorStop(0, `hsl(${hue - 8}, 52%, ${L + 16}%)`);
    g.addColorStop(0.55, `hsl(${hue}, 45%, ${L + 3}%)`);
    g.addColorStop(1, `hsl(${hue + 4}, 40%, ${L - 7}%)`);
    c.fillStyle = g; c.beginPath(); c.arc(x * s, y * s, r * s, 0, TAU); c.fill();
  }
  c.fillStyle = `hsla(${hue - 15}, 60%, ${L + 26}%, .5)`;
  const cy = blobs[0][1];
  for (let i = 0; i < 14; i++) {
    const a = rng() * TAU, d = rng() * 0.36;
    c.beginPath(); c.arc(Math.cos(a) * d * s - s * 0.08, (cy - 0.08 + Math.sin(a) * d * 0.8) * s, s * (0.018 + rng() * 0.022), 0, TAU); c.fill();
  }
}

function drawOak(c, s, v) {
  const rng = mulberry32(v * 977 + 3);
  const tg = c.createLinearGradient(-s * 0.1, 0, s * 0.1, 0);
  tg.addColorStop(0, '#8a5d3a'); tg.addColorStop(0.6, '#5e3b22'); tg.addColorStop(1, '#3f2716');
  c.fillStyle = tg;
  c.beginPath(); c.moveTo(-s * 0.14, 0); c.quadraticCurveTo(-s * 0.06, -s * 0.05, -s * 0.06, -s * 0.62);
  c.lineTo(s * 0.06, -s * 0.62); c.quadraticCurveTo(s * 0.06, -s * 0.05, s * 0.14, 0); c.closePath(); c.fill();
  drawCanopy(c, s, [[0, -1.0, 0.44], [-0.3, -0.85, 0.3], [0.3, -0.86, 0.3], [-0.16, -1.28, 0.3], [0.18, -1.25, 0.29],
    [0, -0.78, 0.32], [-0.38, -1.05, 0.22], [0.38, -1.08, 0.22]], 100 + v * 9, 30 + (v % 2) * 4, rng);
}

function drawPine(c, s, v) {
  c.fillStyle = '#4e3220'; c.fillRect(-s * 0.05, -s * 0.4, s * 0.1, s * 0.4);
  const dark = v ? 22 : 17;
  for (let i = 0; i < 4; i++) {
    const yb = -0.3 - i * 0.33, wdt = 0.5 - i * 0.09, top = yb - 0.55;
    const g = c.createLinearGradient(-wdt * s, 0, wdt * s, 0);
    g.addColorStop(0, `hsl(140, 35%, ${dark + 15}%)`); g.addColorStop(0.5, `hsl(145, 38%, ${dark + 6}%)`); g.addColorStop(1, `hsl(150, 40%, ${dark - 3}%)`);
    c.fillStyle = g; c.beginPath(); c.moveTo(0, top * s); c.lineTo(wdt * s, yb * s);
    for (let k = 0; k <= 6; k++) c.lineTo((wdt - k * (2 * wdt / 6)) * s, (yb + (k % 2 ? 0.06 : 0)) * s);
    c.closePath(); c.fill();
  }
}

function drawStump(c, s) {
  c.fillStyle = '#5e3b22';
  c.beginPath(); c.moveTo(-s * 0.16, 0); c.lineTo(-s * 0.13, -s * 0.16); c.lineTo(s * 0.13, -s * 0.16); c.lineTo(s * 0.16, 0); c.fill();
  c.fillStyle = '#c99c66'; c.beginPath(); c.ellipse(0, -s * 0.16, s * 0.13, s * 0.055, 0, 0, TAU); c.fill();
  c.strokeStyle = '#a87b4a'; c.lineWidth = Math.max(1, s * 0.012);
  c.beginPath(); c.ellipse(0, -s * 0.16, s * 0.07, s * 0.028, 0, 0, TAU); c.stroke();
}

function drawBush(c, s) {
  drawCanopy(c, s, [[0, -0.34, 0.25], [-0.2, -0.2, 0.22], [0.2, -0.2, 0.22], [-0.08, -0.12, 0.2], [0.1, -0.13, 0.2]], 122, 30, mulberry32(42));
}

function drawHouseSprite(c, s, v) {
  const roof = ROOFS[v], L = -0.44 * s, R = 0.44 * s, top = -0.58 * s, sock = -0.09 * s;
  // Sockel
  c.fillStyle = '#7d766b'; c.fillRect(L - s * 0.02, sock, R - L + s * 0.04, -sock);
  c.strokeStyle = 'rgba(0,0,0,.25)'; c.lineWidth = Math.max(1, s * 0.012);
  for (let i = 1; i < 6; i++) { const x = L + i * (R - L) / 6; c.beginPath(); c.moveTo(x, sock); c.lineTo(x, 0); c.stroke(); }
  // Wand
  const wg = c.createLinearGradient(0, top, 0, sock); wg.addColorStop(0, '#f3e6c8'); wg.addColorStop(1, '#d6c098');
  c.fillStyle = wg; c.fillRect(L, top, R - L, sock - top);
  // Fachwerk
  c.strokeStyle = '#5b3a22'; c.lineWidth = s * 0.045; c.lineCap = 'square';
  c.strokeRect(L, top, R - L, sock - top);
  c.beginPath(); c.moveTo(L, -0.33 * s); c.lineTo(R, -0.33 * s);
  for (const x of [-0.17, 0.17]) { c.moveTo(x * s, top); c.lineTo(x * s, sock); }
  c.moveTo(L, top); c.lineTo(-0.17 * s, -0.33 * s); c.moveTo(R, top); c.lineTo(0.17 * s, -0.33 * s);
  c.stroke(); c.lineCap = 'butt';
  // Fenster mit Läden und Blumenkasten
  for (const x of [-0.305, 0.305]) {
    const wx = x * s, wy = -0.47 * s, ws = 0.15 * s;
    c.fillStyle = SHUTTERS[v];
    c.fillRect(wx - ws * 0.5 - s * 0.05, wy - ws * 0.5, s * 0.05, ws); c.fillRect(wx + ws * 0.5, wy - ws * 0.5, s * 0.05, ws);
    c.fillStyle = '#2c3a48'; c.fillRect(wx - ws / 2, wy - ws / 2, ws, ws);
    c.fillStyle = 'rgba(160,200,230,.35)'; c.fillRect(wx - ws / 2, wy - ws / 2, ws * 0.45, ws * 0.45);
    c.strokeStyle = '#5b3a22'; c.lineWidth = Math.max(1, s * 0.02); c.strokeRect(wx - ws / 2, wy - ws / 2, ws, ws);
    c.beginPath(); c.moveTo(wx, wy - ws / 2); c.lineTo(wx, wy + ws / 2); c.moveTo(wx - ws / 2, wy); c.lineTo(wx + ws / 2, wy); c.stroke();
    c.fillStyle = '#6b4526'; c.fillRect(wx - ws * 0.6, wy + ws * 0.5, ws * 1.2, s * 0.035);
    for (let k = 0; k < 3; k++) { c.fillStyle = k % 2 ? '#ffd166' : '#e5484d'; c.beginPath(); c.arc(wx - ws * 0.4 + k * ws * 0.4, wy + ws * 0.5, s * 0.022, 0, TAU); c.fill(); }
  }
  // Tür
  const dg = c.createLinearGradient(-0.09 * s, 0, 0.09 * s, 0); dg.addColorStop(0, '#7a4e2c'); dg.addColorStop(1, '#4e301a');
  c.fillStyle = dg; c.beginPath(); c.moveTo(-0.09 * s, sock); c.lineTo(-0.09 * s, -0.27 * s); c.arc(0, -0.27 * s, 0.09 * s, Math.PI, 0); c.lineTo(0.09 * s, sock); c.fill();
  c.fillStyle = '#e0b85a'; c.beginPath(); c.arc(0.05 * s, -0.18 * s, Math.max(1, s * 0.013), 0, TAU); c.fill();
  // Dach mit Ziegeln
  const rL = -0.56 * s, rR = 0.56 * s, rB = -0.52 * s, peak = -1.12 * s, row = s * 0.075;
  c.save(); c.beginPath(); c.moveTo(rL, rB); c.lineTo(0, peak); c.lineTo(rR, rB); c.closePath();
  const rg = c.createLinearGradient(0, peak, 0, rB); rg.addColorStop(0, shadeHex(roof, 35)); rg.addColorStop(1, roof);
  c.fillStyle = rg; c.fill(); c.clip();
  c.strokeStyle = 'rgba(0,0,0,.22)'; c.lineWidth = Math.max(1, s * 0.016);
  for (let r = 0, y = rB; y > peak; y -= row, r++) {
    c.beginPath(); c.moveTo(rL, y); c.lineTo(rR, y); c.stroke();
    for (let x = rL + (r % 2) * s * 0.06; x < rR; x += s * 0.12) { c.beginPath(); c.moveTo(x, y); c.lineTo(x, y - row); c.stroke(); }
  }
  c.fillStyle = 'rgba(0,0,0,.2)'; c.beginPath(); c.moveTo(0, peak); c.lineTo(rR, rB); c.lineTo(0, rB); c.fill();
  c.restore();
  c.fillStyle = shadeHex(roof, -35); c.fillRect(rL, rB - s * 0.005, rR - rL, s * 0.04);
  // Schornstein
  c.fillStyle = '#8a5a48'; c.fillRect(0.2 * s, -1.02 * s, 0.1 * s, 0.26 * s);
  c.fillStyle = '#5e5650'; c.fillRect(0.185 * s, -1.05 * s, 0.13 * s, 0.04 * s);
}

class Renderer {
  constructor(canvas, sim) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.groundCv = document.createElement('canvas');
    this.shadowCv = document.createElement('canvas');
    this.lightCv = document.createElement('canvas');
    this.vignetteCv = document.createElement('canvas');
    this.sprites = {}; this.spriteTs = 0; this.groundTs = 0; this.zoomAt = 0;
    this.particles = [];
    this.camX = 0; this.camY = 0; this.ts = 0;
    this.follow = null;   // Siedler, dem die Kamera folgt
    this.onTap = null;
    this.last = performance.now();
    this.attachInput();
    this.setSim(sim);
  }

  setSim(sim) {
    this.sim = sim; this.follow = null; this.ts = 0; this.particles = []; this.groundTs = 0;
    this.buildDecor();
    this.resize();
    this.centerOn(sim.world.camp.x + 0.5, sim.world.camp.y + 0.5);
  }

  /** Zufällige, aber feste Details pro Welt: Grashalme, Blumen, Farbflecken, Wassertiefe, Wolken. */
  buildDecor() {
    const { w, h, tiles } = this.sim.world, rng = mulberry32(this.sim.seed * 7 + 13);
    this.blades = tiles.map(() => Array.from({ length: 9 }, () => [rng(), rng(), 0.04 + rng() * 0.05, rng() - 0.5, rng()]));
    this.flowers = tiles.map(() => rng() < 0.16 ? Array.from({ length: 2 + Math.floor(rng() * 3) }, () => [rng(), rng()]) : null);
    this.flowerColor = tiles.map(() => ['#fff3c4', '#f4a7c6', '#c9b6ff', '#ffd166'][Math.floor(rng() * 4)]);
    this.blotches = tiles.map(() => []);
    for (let i = 0; i < w * h * 1.3; i++) {
      const b = { x: rng() * w, y: rng() * h, r: 0.35 + rng() * 0.9, l: rng() < 0.5 ? 1 : -1, a: 0.05 + rng() * 0.07 };
      for (let ty = Math.floor(b.y - b.r); ty <= Math.floor(b.y + b.r); ty++)
        for (let tx = Math.floor(b.x - b.r); tx <= Math.floor(b.x + b.r); tx++)
          if (tx >= 0 && ty >= 0 && tx < w && ty < h) this.blotches[ty * w + tx].push(b);
    }
    const world = this.sim.world;
    this.depth = tiles.map(t => {
      if (t.type !== 'water') return 0;
      for (let r = 1; r <= 3; r++)
        for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
          const n = world.tile(t.x + dx, t.y + dy);
          if (n && n.type !== 'water') return r;
        }
      return 4;
    });
    this.clouds = Array.from({ length: 7 }, () => ({ x: rng() * (w + 12) - 6, y: rng() * h, r: 2.5 + rng() * 3.5, v: 0.12 + rng() * 0.1 }));
    this.rain = Array.from({ length: 150 }, () => ({ x: rng(), y: rng(), l: 0.6 + rng() * 0.6, v: 0.9 + rng() * 0.5 }));
  }

  resize() {
    const wrap = this.canvas.parentElement;
    this.viewW = Math.floor(wrap.clientWidth || window.innerWidth);
    this.viewH = Math.floor(clamp(window.innerHeight * 0.62, 260, this.viewW * 1.4));
    this.dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const W = Math.round(this.viewW * this.dpr), H = Math.round(this.viewH * this.dpr);
    for (const cv of [this.canvas, this.shadowCv, this.lightCv, this.vignetteCv]) { cv.width = W; cv.height = H; }
    this.canvas.style.width = this.viewW + 'px';
    this.canvas.style.height = this.viewH + 'px';
    const vc = this.vignetteCv.getContext('2d');
    const g = vc.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.4)');
    vc.fillStyle = g; vc.fillRect(0, 0, W, H);
    this.spriteTs = 0; this.groundTs = 0;
    this.setZoom(this.ts || clamp(Math.floor(this.viewW / 10), 28, 56));
  }

  setZoom(z, fx = this.viewW / 2, fy = this.viewH / 2) {
    const { w, h } = this.sim.world;
    const minZ = Math.min(this.viewW / w, this.viewH / h);
    const old = this.ts || z;
    const wx = (this.camX + fx) / old, wy = (this.camY + fy) / old; // Punkt unter dem Finger bleibt stehen
    this.ts = clamp(z, minZ, 80);
    this.camX = wx * this.ts - fx; this.camY = wy * this.ts - fy;
    this.clampCam();
    this.zoomAt = performance.now();
  }

  centerOn(tx, ty) { this.camX = tx * this.ts - this.viewW / 2; this.camY = ty * this.ts - this.viewH / 2; this.clampCam(); }

  clampCam() {
    const mw = this.sim.world.w * this.ts, mh = this.sim.world.h * this.ts;
    this.camX = mw <= this.viewW ? (mw - this.viewW) / 2 : clamp(this.camX, 0, mw - this.viewW);
    this.camY = mh <= this.viewH ? (mh - this.viewH) / 2 : clamp(this.camY, 0, mh - this.viewH);
  }

  attachInput() {
    const cv = this.canvas, pts = new Map();
    let moved = 0, pinch = null;
    const pinchState = () => {
      const [a, b] = [...pts.values()];
      return { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, z: this.ts };
    };
    cv.style.touchAction = 'none';
    cv.addEventListener('pointerdown', e => {
      cv.setPointerCapture(e.pointerId);
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pts.size === 1) moved = 0;
      if (pts.size === 2) pinch = pinchState();
    });
    cv.addEventListener('pointermove', e => {
      const p = pts.get(e.pointerId);
      if (!p) return;
      const dx = e.clientX - p.x, dy = e.clientY - p.y;
      p.x = e.clientX; p.y = e.clientY;
      if (pts.size === 1) {
        moved += Math.abs(dx) + Math.abs(dy);
        if (moved > 6) { this.follow = null; this.camX -= dx; this.camY -= dy; this.clampCam(); }
      } else if (pts.size === 2 && pinch) {
        const now = pinchState(), r = cv.getBoundingClientRect();
        this.setZoom(pinch.z * now.d / pinch.d, now.mx - r.left, now.my - r.top);
        moved = 99;
      }
    });
    const end = e => {
      const had = pts.delete(e.pointerId);
      if (pts.size < 2) pinch = null;
      if (had && e.type === 'pointerup' && pts.size === 0 && moved <= 6 && this.onTap) this.onTap(this.npcAt(e.clientX, e.clientY));
    };
    cv.addEventListener('pointerup', end);
    cv.addEventListener('pointercancel', end);
    cv.addEventListener('wheel', e => {
      e.preventDefault();
      const r = cv.getBoundingClientRect();
      this.setZoom(this.ts * (e.deltaY < 0 ? 1.15 : 1 / 1.15), e.clientX - r.left, e.clientY - r.top);
    }, { passive: false });
  }

  npcAt(clientX, clientY) {
    const r = this.canvas.getBoundingClientRect();
    const tx = (clientX - r.left + this.camX) / this.ts - 0.5;
    const ty = (clientY - r.top + this.camY) / this.ts - 0.3;
    let best = null, bd = 1.2;
    for (const n of this.sim.npcs) {
      if (n.inside) continue;
      const d = Math.hypot(n.x - tx, n.y - ty);
      if (d < bd) { bd = d; best = n; }
    }
    return best;
  }

  // ------------------------------------------------------ Zwischenspeicher
  makeSprite(wT, hT, axT, ayT, draw) {
    const s = this.ts, k = this.dpr;
    const cv = document.createElement('canvas');
    cv.width = Math.ceil(wT * s * k); cv.height = Math.ceil(hT * s * k);
    const c = cv.getContext('2d');
    c.scale(k, k); c.translate(axT * s, ayT * s); c.lineJoin = 'round';
    draw(c, s);
    const sh = document.createElement('canvas'); sh.width = cv.width; sh.height = cv.height;
    const d = sh.getContext('2d');
    d.drawImage(cv, 0, 0); d.globalCompositeOperation = 'source-in'; d.fillStyle = '#000'; d.fillRect(0, 0, sh.width, sh.height);
    return { cv, sh, w: wT * s, h: hT * s, ax: axT * s, ay: ayT * s };
  }

  buildSprites() {
    const S = {};
    for (let v = 0; v < 4; v++) S['oak' + v] = this.makeSprite(1.4, 2.0, 0.7, 1.9, (c, s) => drawOak(c, s, v));
    for (let v = 0; v < 2; v++) S['pine' + v] = this.makeSprite(1.2, 2.1, 0.6, 2.0, (c, s) => drawPine(c, s, v));
    S.stump = this.makeSprite(0.6, 0.5, 0.3, 0.4, drawStump);
    S.bush = this.makeSprite(1.0, 0.95, 0.5, 0.85, drawBush);
    for (let v = 0; v < ROOFS.length; v++) S['house' + v] = this.makeSprite(1.4, 1.95, 0.7, 1.8, (c, s) => drawHouseSprite(c, s, v));
    this.sprites = S; this.spriteTs = this.ts;
  }

  buildGround() {
    const { w, h, tiles } = this.sim.world;
    const g = Math.min(this.dpr, 4096 / (w * this.ts), 4096 / (h * this.ts));
    this.groundCv.width = Math.ceil(w * this.ts * g); this.groundCv.height = Math.ceil(h * this.ts * g);
    const c = this.groundCv.getContext('2d');
    c.setTransform(g, 0, 0, g, 0, 0); c.lineCap = 'round';
    for (const t of tiles) this.drawGroundTile(c, t, this.ts);
    this.groundTs = this.ts; this.groundScale = g;
    this.sim.world.dirtyTiles.clear();
  }

  refreshDirtyGround() {
    const world = this.sim.world;
    if (!world.dirtyTiles.size || this.groundTs !== this.ts) return;
    const c = this.groundCv.getContext('2d');
    c.setTransform(this.groundScale, 0, 0, this.groundScale, 0, 0); c.lineCap = 'round';
    const todo = new Set();
    for (const t of world.dirtyTiles) { todo.add(t); for (const [dx, dy] of DIRS) { const n = world.tile(t.x + dx, t.y + dy); if (n) todo.add(n); } }
    for (const t of todo) this.drawGroundTile(c, t, this.ts);
    world.dirtyTiles.clear();
  }

  pathLevel(t) {
    if (!t) return 0;
    if (t.type === 'camp' || t.type === 'house' || t.type === 'site') return 1;
    return t.type === 'grass' ? Math.min(1, t.traffic / 50) : 0;
  }

  /** Boden einer Kachel (wird nur bei Änderungen neu gezeichnet). */
  drawGroundTile(c, t, s) {
    const world = this.sim.world, x = t.x * s, y = t.y * s, i = t.y * world.w + t.x;
    const e = 0.75; // leicht überlappen, damit keine Kanten sichtbar werden
    c.save(); c.beginPath(); c.rect(x - e, y - e, s + 2 * e, s + 2 * e); c.clip();
    if (t.type === 'water') {
      c.fillStyle = 'hsl(204, 55%, 37%)'; // Tiefe kommt aus dem hellen Ufer-Verlauf c.fillRect(x - e, y - e, s + 2 * e, s + 2 * e);
      for (const [dx, dy] of DIRS) {
        const nb = world.tile(t.x + dx, t.y + dy);
        if (!nb || nb.type === 'water') continue;
        const ex = dx === 1 ? x + s : x, ey = dy === 1 ? y + s : y;
        const g = dx ? c.createLinearGradient(ex, 0, ex - dx * s * 0.9, 0) : c.createLinearGradient(0, ey, 0, ey - dy * s * 0.9);
        g.addColorStop(0, 'rgba(140, 215, 200, .6)'); g.addColorStop(1, 'rgba(140, 215, 200, 0)');
        c.fillStyle = g; c.fillRect(x, y, s, s);
      }
    } else {
      // einheitliche Grundfarbe; Abwechslung kommt aus den weichen Flecken (keine Kachelkanten)
      c.fillStyle = 'hsl(100, 40%, 35%)'; c.fillRect(x - e, y - e, s + 2 * e, s + 2 * e);
      for (const b of this.blotches[i]) { // weiche Farbflecken
        const col = b.l > 0 ? '190, 230, 120' : '10, 40, 10';
        const g = c.createRadialGradient(b.x * s, b.y * s, 0, b.x * s, b.y * s, b.r * s);
        g.addColorStop(0, `rgba(${col}, ${b.a * 1.2})`); g.addColorStop(1, `rgba(${col}, 0)`);
        c.fillStyle = g; c.fillRect((b.x - b.r) * s, (b.y - b.r) * s, b.r * 2 * s, b.r * 2 * s);
      }
      if (t.type === 'tree') {
        const g = c.createRadialGradient(x + s / 2, y + s * 0.7, 0, x + s / 2, y + s * 0.7, s * 0.7);
        g.addColorStop(0, 'rgba(10,35,10,.22)'); g.addColorStop(1, 'rgba(10,35,10,0)');
        c.fillStyle = g; c.fillRect(x - s * 0.2, y, s * 1.4, s * 1.4);
      }
      // Sandufer
      for (const [dx, dy] of DIRS) {
        const nb = world.tile(t.x + dx, t.y + dy);
        if (!nb || nb.type !== 'water') continue;
        const ex = dx === 1 ? x + s : x, ey = dy === 1 ? y + s : y;
        const g = dx ? c.createLinearGradient(ex, 0, ex - dx * s * 0.4, 0) : c.createLinearGradient(0, ey, 0, ey - dy * s * 0.4);
        g.addColorStop(0, 'rgba(222, 204, 150, 1)'); g.addColorStop(0.5, 'rgba(222, 204, 150, .7)'); g.addColorStop(1, 'rgba(222, 204, 150, 0)');
        c.fillStyle = g; c.fillRect(x, y, s, s);
      }
      // Wege und Höfe
      const p = this.pathLevel(t);
      if (p > 0.15) {
        const cx = x + s / 2, cy = y + s / 2;
        const dirt = q => `rgb(${Math.round(92 + 56 * q)}, ${Math.round(124 - 8 * q)}, ${Math.round(58 + 18 * q)})`; // Gras → Erde
        for (const [dx, dy] of DIRS) {
          const q = Math.min(p, this.pathLevel(world.tile(t.x + dx, t.y + dy)));
          if (q <= 0.15) continue;
          c.strokeStyle = dirt(q); c.lineWidth = s * (0.22 + q * 0.2);
          c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + dx * s * 0.5, cy + dy * s * 0.5); c.stroke();
        }
        c.fillStyle = dirt(p);
        c.beginPath(); c.arc(cx, cy, s * (t.type === 'grass' ? 0.11 + p * 0.1 : 0.46), 0, TAU); c.fill();
      }
      // Grashalme und Blumen
      if (t.type === 'grass' && p < 0.5) {
        c.lineWidth = Math.max(1, s * 0.025);
        for (const [bx, by, bh, lean, tone] of this.blades[i]) {
          c.strokeStyle = tone > 0.5 ? 'rgba(150, 200, 95, .35)' : 'rgba(25, 65, 25, .3)';
          const px = x + bx * s, py = y + by * s;
          c.beginPath(); c.moveTo(px, py); c.quadraticCurveTo(px + lean * s * 0.05, py - bh * s * 0.6, px + lean * s * 0.1, py - bh * s); c.stroke();
        }
        const fl = this.flowers[i];
        if (fl) for (const [fx, fy] of fl) {
          const px = x + fx * s, py = y + fy * s, r = Math.max(1, s * 0.03);
          c.fillStyle = this.flowerColor[i];
          for (let k = 0; k < 4; k++) { c.beginPath(); c.arc(px + Math.cos(k * TAU / 4) * r, py + Math.sin(k * TAU / 4) * r, r, 0, TAU); c.fill(); }
          c.fillStyle = '#f0b54a'; c.beginPath(); c.arc(px, py, r * 0.7, 0, TAU); c.fill();
        }
      }
    }
    c.restore();
  }

  // ---------------------------------------------------------- Umgebung
  sunInfo() {
    const h = this.sim.hourFloat;
    if (h < 6 || h > 20) return { alpha: 0, dx: 0, len: 0 };
    const t = (h - 6) / 14, elev = Math.sin(Math.PI * t);
    const weatherFactor = { klar: 1, 'bewölkt': 0.45, regen: 0.2 }[this.sim.weather] ?? 1;
    return { alpha: 0.3 * Math.min(1, elev * 4) * weatherFactor, dx: -Math.cos(Math.PI * t), len: 0.25 + (1 - elev) * 0.9 };
  }

  nightAlpha() {
    const h = this.sim.hourFloat;
    return 0.72 * (h < 12 ? 1 - smooth(5, 7, h) : smooth(19, 21.5, h));
  }

  // -------------------------------------------------------------- Siedler
  pose(n) {
    const a = n.action, step = n.task && n.task.steps[n.task.i];
    const moving = !!(step && step.kind === 'move' && step.path.length);
    let arms = n.inventory.wood > 0 ? 'carry' : 'none';
    if (!moving && a) {
      if (a.id === 'gatherWood') arms = 'chop';
      else if (a.id === 'build') arms = 'build';
      else if (a.id === 'eat') arms = 'eat';
      else if (a.id === 'socialize') arms = 'talk';
    }
    let facing = n.facing || 1;
    if (!moving && step && step.face) { const dx = step.face.x - n.x; if (Math.abs(dx) > 0.1) facing = dx > 0 ? 1 : -1; }
    return { moving, arms, facing, step };
  }

  drawSettler(c, n, px, py, s, now, pose) {
    const skin = SKIN[n.id % SKIN.length], hair = HAIR[(n.id * 7) % HAIR.length];
    const outline = 'rgba(20, 14, 10, .45)', ow = Math.max(1, s * 0.02);
    if (n.sleeping) { // liegt draußen am Feuer, zugedeckt
      c.fillStyle = n.color; c.beginPath(); c.ellipse(px, py + s * 0.2, s * 0.28, s * 0.11, 0, 0, TAU); c.fill();
      c.strokeStyle = outline; c.lineWidth = ow; c.stroke();
      c.fillStyle = skin; c.beginPath(); c.arc(px - s * 0.3, py + s * 0.15, s * 0.1, 0, TAU); c.fill(); c.stroke();
      c.fillStyle = hair; c.beginPath(); c.arc(px - s * 0.33, py + s * 0.13, s * 0.09, Math.PI * 0.6, Math.PI * 1.6); c.fill();
      return;
    }
    const walk = pose.moving ? Math.sin(now / 110 + n.id * 1.7) : 0;
    const k = 1.1, by = py + s * 0.38 - Math.abs(walk) * s * 0.03, L = s * 0.2 * k;
    c.save();
    c.translate(px, by); c.scale(pose.facing * k, k);
    c.lineCap = 'round';
    // Beine
    c.strokeStyle = '#3f3229'; c.lineWidth = s * 0.075;
    c.beginPath(); c.moveTo(-s * 0.05, -s * 0.2); c.lineTo(-s * 0.05 + walk * s * 0.09, 0);
    c.moveTo(s * 0.05, -s * 0.2); c.lineTo(s * 0.05 - walk * s * 0.09, 0); c.stroke();
    c.fillStyle = '#2a1d14';
    c.beginPath(); c.ellipse(-s * 0.04 + walk * s * 0.09, 0, s * 0.05, s * 0.025, 0, 0, TAU); c.ellipse(s * 0.06 - walk * s * 0.09, 0, s * 0.05, s * 0.025, 0, 0, TAU); c.fill();
    // Armwinkel (0 = hängt, π = nach oben)
    const swing = (Math.sin(now / 130 + n.id) + 1) / 2;
    let back = -walk * 0.6 + 0.1, front = walk * 0.6 + 0.1;
    if (pose.arms === 'chop' || pose.arms === 'build') front = 0.5 + swing * 2.2;
    else if (pose.arms === 'eat') front = 2.5 + Math.sin(now / 200) * 0.2;
    else if (pose.arms === 'carry') { front = 2.7; back = 2.4; }
    else if (pose.arms === 'talk') front = 1.0 + Math.sin(now / 260 + n.id) * 0.5;
    const sx = 0, sy = -s * 0.44;
    const arm = (a, col) => {
      const hx = sx + Math.sin(a) * L / k, hy = sy + Math.cos(a) * L / k;
      c.strokeStyle = outline; c.lineWidth = s * 0.07 + ow * 2; c.beginPath(); c.moveTo(sx, sy); c.lineTo(hx, hy); c.stroke();
      c.strokeStyle = col; c.lineWidth = s * 0.07; c.beginPath(); c.moveTo(sx, sy); c.lineTo(hx, hy); c.stroke();
      c.fillStyle = skin; c.beginPath(); c.arc(hx, hy, s * 0.038, 0, TAU); c.fill();
      return [hx, hy];
    };
    arm(back, n.color);
    // Körper (Kittel mit Schattierung und Gürtel)
    const bg = c.createLinearGradient(-s * 0.15, 0, s * 0.15, 0);
    bg.addColorStop(0, n.color); bg.addColorStop(1, 'rgba(0,0,0,.25)');
    c.beginPath(); c.moveTo(-s * 0.11, -s * 0.49); c.lineTo(s * 0.11, -s * 0.49); c.lineTo(s * 0.155, -s * 0.17); c.lineTo(-s * 0.155, -s * 0.17); c.closePath();
    c.fillStyle = n.color; c.fill(); c.fillStyle = bg; c.fill();
    c.strokeStyle = outline; c.lineWidth = ow; c.stroke();
    c.fillStyle = '#5a3a22'; c.fillRect(-s * 0.135, -s * 0.3, s * 0.27, s * 0.035);
    c.fillStyle = '#e0b85a'; c.fillRect(-s * 0.02, -s * 0.305, s * 0.04, s * 0.045);
    // Kopf
    c.fillStyle = skin; c.beginPath(); c.arc(s * 0.01, -s * 0.61, s * 0.12, 0, TAU); c.fill();
    c.strokeStyle = outline; c.lineWidth = ow; c.stroke();
    c.fillStyle = hair; c.beginPath(); c.arc(0, -s * 0.63, s * 0.125, Math.PI * 1.0, Math.PI * 2.05); c.fill();
    c.beginPath(); c.arc(-s * 0.07, -s * 0.61, s * 0.075, 0, TAU); c.fill();
    c.fillStyle = '#2a1d14'; c.beginPath(); c.arc(s * 0.075, -s * 0.61, Math.max(0.8, s * 0.017), 0, TAU); c.fill();
    c.fillStyle = 'rgba(230, 120, 110, .35)'; c.beginPath(); c.arc(s * 0.06, -s * 0.565, s * 0.025, 0, TAU); c.fill();
    // Holz auf der Schulter
    if (pose.arms === 'carry') {
      for (let j = 0; j < Math.min(3, Math.ceil(n.inventory.wood / 2)); j++) {
        const ly = -s * (0.51 + j * 0.07);
        c.fillStyle = '#7a5230'; c.fillRect(-s * 0.25, ly - s * 0.032, s * 0.44, s * 0.065);
        c.fillStyle = '#d6a76d'; c.beginPath(); c.arc(s * 0.19, ly, s * 0.034, 0, TAU); c.fill();
      }
    }
    // vorderer Arm mit Werkzeug
    const [hx, hy] = arm(front, n.color);
    if (pose.arms === 'chop' || pose.arms === 'build') {
      c.save(); c.translate(hx, hy); c.rotate(-front);
      c.strokeStyle = '#8a6239'; c.lineWidth = s * 0.035;
      c.beginPath(); c.moveTo(0, -s * 0.04); c.lineTo(0, s * 0.22); c.stroke();
      c.fillStyle = '#aab3bb';
      if (pose.arms === 'chop') { c.beginPath(); c.moveTo(0, s * 0.13); c.lineTo(s * 0.12, s * 0.1); c.lineTo(s * 0.12, s * 0.25); c.lineTo(0, s * 0.22); c.fill(); }
      else c.fillRect(-s * 0.05, s * 0.17, s * 0.13, s * 0.07);
      c.restore();
    } else if (pose.arms === 'eat') {
      c.fillStyle = '#b8325f'; c.beginPath(); c.arc(hx, hy - s * 0.03, s * 0.035, 0, TAU); c.fill();
    }
    c.restore();
  }

  // ---------------------------------------------------- dynamische Objekte
  drawCamp(c, t, s, now) {
    const x = t.x * s, y = t.y * s, cx = x + s * 0.58, cy = y + s * 0.72;
    // Holzlager
    const logs = Math.min(14, Math.ceil(this.sim.settlement.stock.wood / 1.5));
    let i = 0;
    for (let row = 0; row < 4 && i < logs; row++)
      for (let k = 0; k < 5 - row && i < logs; k++, i++) {
        const lx = x - s * 0.22 + (k + row * 0.5) * s * 0.12, ly = y + s * (0.95 - row * 0.1);
        c.fillStyle = '#6b4526'; c.fillRect(lx - s * 0.055, ly - s * 0.24, s * 0.11, s * 0.24);
        const g = c.createRadialGradient(lx, ly, 0, lx, ly, s * 0.058);
        g.addColorStop(0, '#e2b77e'); g.addColorStop(1, '#a87b4a');
        c.fillStyle = g; c.beginPath(); c.arc(lx, ly, s * 0.058, 0, TAU); c.fill();
      }
    // Steinring und Glut
    for (let k = 0; k < 8; k++) {
      const a = k / 8 * TAU;
      c.fillStyle = k % 2 ? '#8f8d85' : '#77756e';
      c.beginPath(); c.ellipse(cx + Math.cos(a) * s * 0.25, cy + Math.sin(a) * s * 0.11, s * 0.065, s * 0.048, 0, 0, TAU); c.fill();
    }
    c.fillStyle = '#ff7a2a'; c.beginPath(); c.ellipse(cx, cy, s * 0.17, s * 0.07, 0, 0, TAU); c.fill();
    c.fillStyle = '#3a2416';
    c.save(); c.translate(cx, cy); c.rotate(0.35); c.fillRect(-s * 0.2, -s * 0.03, s * 0.4, s * 0.06); c.rotate(-0.7); c.fillRect(-s * 0.2, -s * 0.03, s * 0.4, s * 0.06); c.restore();
    // Flammen
    const flame = (h, w, col, ph) => {
      const fh = s * h * (0.82 + 0.18 * Math.sin(now / 85 + ph) + 0.06 * Math.sin(now / 37 + ph * 2));
      c.fillStyle = col; c.beginPath(); c.moveTo(cx - s * w, cy);
      c.quadraticCurveTo(cx - s * w * 1.1, cy - fh * 0.55, cx + Math.sin(now / 140 + ph) * s * 0.05, cy - fh);
      c.quadraticCurveTo(cx + s * w * 1.1, cy - fh * 0.55, cx + s * w, cy); c.fill();
    };
    flame(0.62, 0.16, '#d9481c', 0); flame(0.46, 0.12, '#ff8f2a', 1.7); flame(0.28, 0.07, '#ffe27a', 3.1);
  }

  drawSite(c, t, s, now, site) {
    const p = Math.min(1, site.progress / site.work), bx = (t.x + 0.5) * s, by = (t.y + 0.95) * s;
    c.fillStyle = 'rgba(150,118,78,.9)'; c.beginPath(); c.ellipse(bx, by - s * 0.05, s * 0.55, s * 0.18, 0, 0, TAU); c.fill();
    const sp = this.sprites['house' + (this.sim.settlement.buildings.length + 1) % ROOFS.length];
    const visTop = by + (sp.h - sp.ay) - sp.h * (0.05 + p * 0.95);
    c.save(); c.beginPath(); c.rect(bx - sp.ax, visTop, sp.w, by + sp.h); c.clip();
    c.drawImage(sp.cv, bx - sp.ax, by - sp.ay, sp.w, sp.h); c.restore();
    // Gerüst
    c.strokeStyle = '#b48a58'; c.lineWidth = Math.max(1.2, s * 0.035);
    const top = by - s * Math.max(0.35, 1.15 * p);
    c.beginPath();
    for (const gx of [-0.52, 0.52]) { c.moveTo(bx + gx * s, by); c.lineTo(bx + gx * s, top); }
    for (let yy = by - s * 0.3; yy > top; yy -= s * 0.3) { c.moveTo(bx - 0.55 * s, yy); c.lineTo(bx + 0.55 * s, yy); }
    c.stroke();
    // Bretterstapel
    c.fillStyle = '#c99c66'; for (let k = 0; k < 3; k++) c.fillRect(bx + s * 0.35, by - s * (0.04 + k * 0.05), s * 0.32, s * 0.04);
    // Fortschritt
    const bw = s * 0.9, bh = Math.max(4, s * 0.09), barY = top - s * 0.25;
    c.fillStyle = 'rgba(0,0,0,.55)'; c.fillRect(bx - bw / 2, barY, bw, bh);
    c.fillStyle = '#f0b54a'; c.fillRect(bx - bw / 2, barY, bw * p, bh);
  }

  treeSprite(t) {
    return t.shade < 0.3 ? this.sprites['pine' + (t.shade < 0.15 ? 0 : 1)] : this.sprites['oak' + Math.min(3, Math.floor((t.shade - 0.3) / 0.7 * 4))];
  }
  treeBase(t, s) { return [(t.x + 0.5 + (t.shade - 0.5) * 0.18) * s, (t.y + 0.86) * s]; }

  // --------------------------------------------------------------- Partikel
  emit(type, x, y, o = {}) {
    if (this.particles.length > 320) return;
    const life = o.life || 1;
    this.particles.push({ type, x, y, vx: 0, vy: 0, g: 0, size: 0.05, seed: Math.random() * 10, ...o, life, max: life });
  }

  updateParticles(dt) {
    for (const p of this.particles) {
      p.life -= dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.type === 'leaf') p.x += Math.sin(p.life * 3 + p.seed) * dt * 0.4;
      if (p.type === 'firefly') { p.vx = clamp(p.vx + (Math.random() - 0.5) * dt * 1.5, -0.4, 0.4); p.vy = clamp(p.vy + (Math.random() - 0.5) * dt * 1.5, -0.4, 0.4); }
    }
    this.particles = this.particles.filter(p => p.life > 0);
  }

  drawParticles(c, s, now, glow) {
    for (const p of this.particles) {
      const isGlow = p.type === 'spark' || p.type === 'firefly';
      if (isGlow !== glow) continue;
      const k = p.life / p.max, x = p.x * s, y = p.y * s;
      switch (p.type) {
        case 'chip':
          c.fillStyle = `rgba(214, 167, 109, ${k})`; c.fillRect(x, y, p.size * s, p.size * s * 0.6); break;
        case 'dust':
          c.fillStyle = `rgba(200, 175, 135, ${0.35 * k})`; c.beginPath(); c.arc(x, y, p.size * s * (1.6 - k), 0, TAU); c.fill(); break;
        case 'leaf':
          c.fillStyle = p.color; c.globalAlpha = Math.min(1, k * 2);
          c.beginPath(); c.ellipse(x, y, s * 0.04, s * 0.02, p.seed + now / 400, 0, TAU); c.fill(); c.globalAlpha = 1; break;
        case 'ripple':
          c.strokeStyle = `rgba(255,255,255,${0.5 * k})`; c.lineWidth = 1;
          c.beginPath(); c.ellipse(x, y, s * 0.3 * (1 - k), s * 0.12 * (1 - k), 0, 0, TAU); c.stroke(); break;
        case 'spark':
          c.fillStyle = `rgba(255, ${150 + 80 * k | 0}, 60, ${k})`; c.beginPath(); c.arc(x, y, Math.max(0.8, p.size * s), 0, TAU); c.fill(); break;
        case 'firefly': {
          const a = (0.5 + 0.5 * Math.sin(now / 280 + p.seed * 5)) * Math.min(1, k * 3, (p.max - p.life) * 2);
          const g = c.createRadialGradient(x, y, 0, x, y, s * 0.18);
          g.addColorStop(0, `rgba(220, 255, 140, ${a})`); g.addColorStop(1, 'rgba(220,255,140,0)');
          c.fillStyle = g; c.fillRect(x - s * 0.18, y - s * 0.18, s * 0.36, s * 0.36); break;
        }
      }
    }
  }

  emitAmbient(dt, x0, x1, y0, y1, na, drawn) {
    const sim = this.sim, w = sim.world, chance = r => Math.random() < r * dt;
    const cp = sim.settlement.camp;
    if (cp.x >= x0 - 1 && cp.x <= x1 + 1 && cp.y >= y0 - 1 && cp.y <= y1 + 1 && chance(7))
      this.emit('spark', cp.x + 0.58 + rand(-0.1, 0.1), cp.y + 0.45, { vx: rand(-0.15, 0.15), vy: -rand(0.5, 1.1), life: rand(0.6, 1.4), size: 0.022 });
    for (const e of drawn) {
      const { n, pose } = e, f = pose.step && pose.step.face;
      if (pose.arms === 'chop' && f && chance(2.5))
        for (let k = 0; k < 3; k++) this.emit('chip', f.x + 0.5, f.y + 0.55, { vx: rand(-1, 1), vy: -rand(0.8, 1.6), g: 5, life: 0.6, size: 0.05 });
      if (pose.arms === 'build' && f && chance(2)) this.emit('dust', f.x + rand(0.2, 0.8), f.y + 0.8, { vy: -0.15, life: 0.9, size: 0.1 });
      if (pose.moving && chance(1.2)) { const t = w.tile(Math.round(n.x), Math.round(n.y)); if (t && t.traffic > 15) this.emit('dust', n.x + 0.5, n.y + 0.88, { vy: -0.1, life: 0.8, size: 0.09 }); }
    }
    const rx = () => Math.floor(rand(x0, x1 + 1)), ry = () => Math.floor(rand(y0, y1 + 1));
    if (na < 0.2 && sim.weather !== 'regen' && chance(1.5)) {
      const t = w.tile(rx(), ry());
      if (t && t.type === 'tree') this.emit('leaf', t.x + 0.5 + rand(-0.3, 0.3), t.y - 0.4, { vx: 0.25, vy: 0.3, life: 3, color: Math.random() < 0.3 ? '#d9b44a' : '#7fb24a' });
    }
    if (sim.weather === 'regen') for (let k = 0; k < 3; k++) if (chance(5)) {
      const t = w.tile(rx(), ry());
      if (t && t.type === 'water') this.emit('ripple', t.x + rand(0.1, 0.9), t.y + rand(0.1, 0.9), { life: 0.7 });
    }
    if (na > 0.3 && sim.weather !== 'regen' && this.particles.filter(p => p.type === 'firefly').length < 24 && chance(5)) {
      const t = w.tile(rx(), ry());
      if (t && (t.type === 'tree' || t.type === 'bush' || t.type === 'water')) this.emit('firefly', t.x + rand(0, 1), t.y + rand(-0.3, 0.8), { life: rand(5, 9) });
    }
  }

  // ------------------------------------------------------------- Ein Bild
  render(alpha, selected) {
    const { ctx: c, sim } = this;
    const now = performance.now(), dt = Math.min(0.1, (now - this.last) / 1000);
    this.last = now; this.now = now;
    const settled = now - this.zoomAt > 180;
