<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121a15">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Siedlung">
<title>Siedlung</title>
<style>
  :root {
    --bg: #121a15;
    --panel: #1b261e;
    --panel-2: #243127;
    --text: #ecf1e8;
    --muted: #9db09c;
    --accent: #f0b54a;
    --hunger: #e0664f;
    --energy: #6fcf6a;
    --social: #6fb6ef;
    --mood: #e9c46a;
    --border: #2f3f32;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent; }
  body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  .wrap { max-width: 760px; margin: 0 auto; padding-block: 8px 20px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  button { font: inherit; color: var(--text); cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  header { padding-bottom: 8px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  #clock { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ctrls { display: flex; gap: 4px; }
  .ctrls button { min-width: 42px; height: 36px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); font-weight: 600; }
  .ctrls button.active { background: var(--accent); color: #2a1d05; border-color: var(--accent); }
  #soundBtn { position: absolute; right: 8px; top: 8px; width: 40px; height: 40px; border-radius: 10px; border: 1px solid #ffffff22; background: #121a15cc; font-size: 18px; backdrop-filter: blur(4px); }
  #soundBtn.active { border-color: var(--accent); }
  .mapBtn { position: absolute; right: 8px; width: 40px; height: 40px; border-radius: 10px; border: 1px solid #ffffff22; background: #121a15cc; font-size: 18px; backdrop-filter: blur(4px); z-index: 3; }
  .mapBtn.active { border-color: var(--accent); background: #3a2a0ecc; }
  #mapWrap.cine::before, #mapWrap.cine::after { content: ''; position: absolute; left: 0; right: 0; height: 7%; background: #000; z-index: 2; pointer-events: none; }
  #mapWrap.cine::before { top: 0; } #mapWrap.cine::after { bottom: 0; }
  #narr { position: absolute; left: 12px; right: 60px; bottom: 9%; z-index: 3; text-align: center; font-size: 13px; line-height: 1.35; color: #fff; text-shadow: 0 1px 3px #000, 0 0 8px #000; pointer-events: none; }
  #narr b { font-weight: 800; }
  #chapter { position: absolute; inset: 0; z-index: 6; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 24px; text-align: center;
    background: radial-gradient(ellipse at center, #0b0f1ae6 0%, #000000f2 80%); color: #f3ead6; animation: chIn 1.2s ease-out; cursor: pointer; }
  #chapter[hidden] { display: none; }
  #chapter .ch-num { letter-spacing: .35em; font-size: 11px; color: #f0b54a; text-transform: uppercase; }
  #chapter .ch-title { font: 700 clamp(20px, 6vw, 30px)/1.2 Georgia, 'Times New Roman', serif; margin: 6px 0 12px; color: #fff4d6; text-shadow: 0 0 18px #f0b54a66; }
  #chapter .ch-text { max-width: 440px; font: italic 15px/1.55 Georgia, serif; color: #e8dcc0; }
  #chapter .ch-tap { margin-top: 16px; font-size: 11px; color: #ffffff66; }
  @keyframes chIn { from { opacity: 0; } to { opacity: 1; } }
  #rift { position: absolute; inset: 0; z-index: 5; background: #000; }
  #rift[hidden] { display: none; }
  #riftCv { display: block; }
  #riftHud { position: absolute; left: 8px; top: 8px; width: min(230px, 58%); padding: 6px 9px; font-size: 11px !important; border: 1px solid #5fb8ffaa; border-radius: 10px; background: #08162acc;
    box-shadow: 0 0 14px #3aa0ff44; font-size: 12px; color: #e8f4ff; backdrop-filter: blur(3px); }
  #riftHud .sys-title { font-weight: 800; letter-spacing: .2em; font-size: 10px; color: #8fd3ff; }
  #riftHud .bar { margin-bottom: 2px; }
  .riftBtn { margin-top: 6px; width: 100%; height: 34px; border-radius: 10px; border: 1px solid #5fb8ffaa; background: #0c2440; color: #bfe6ff; font-weight: 700; }
  #modalHtml { max-height: 60vh; overflow-y: auto; margin-bottom: 8px; }
  #modalHtml .chap { border-left: 2px solid var(--accent); padding: 4px 0 6px 10px; margin-bottom: 10px; }
  #modalHtml .chap small { color: var(--accent); letter-spacing: .1em; }
  #modalHtml .chap b { display: block; font-family: Georgia, serif; font-size: 15px; }
  #modalHtml .chap p { margin: 2px 0 0; font: italic 13px/1.45 Georgia, serif; color: var(--text); }
  #modalHtml .chap.next { border-left-style: dashed; opacity: .75; }
  .diary li { font: italic 12px/1.4 Georgia, serif; }
  .role { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 6px; background: #f0b54a33; color: #ffd98a; margin-top: 3px; }
  #realm { margin-top: 4px; font-weight: 700; color: var(--accent); font-size: 13px; min-height: 1em; }
  #stats { margin: 6px 0; color: var(--muted); font-variant-numeric: tabular-nums; }
  #stats b { color: var(--text); }
  .goal { height: 5px; background: #0005; border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .goal > i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
  #log { list-style: none; margin: 0; padding: 6px 8px; height: 104px; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px; font-size: 13px; }
  #log li { padding: 1px 0; border-bottom: 1px solid #ffffff0a; }
  #log .t { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 4px; }
  #log .who { font-weight: 700; }
  #log .event { color: var(--accent); font-weight: 600; }

  #mapWrap { position: relative; display: flex; justify-content: center; border-radius: 12px; overflow: hidden;
    box-shadow: 0 6px 24px #0008, inset 0 0 0 1px #ffffff10; }
  canvas { display: block; }
  #zoomBtns { position: absolute; right: 8px; bottom: 8px; display: flex; flex-direction: column; gap: 6px; }
  #zoomBtns button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid #ffffff22; background: #121a15cc;
    font-size: 20px; font-weight: 600; backdrop-filter: blur(4px); }
  #minimap { position: absolute; left: 8px; top: 8px; width: 96px; height: 96px; border-radius: 8px; border: 1px solid #ffffff33;
    background: #0008; image-rendering: pixelated; box-shadow: 0 2px 10px #0008; cursor: pointer; }
  #sysWin { position: absolute; left: 114px; right: 56px; top: 8px; padding: 8px 12px;
    background: linear-gradient(180deg, #0e2a4acc, #0a1a33dd); border: 1px solid #6fc3ff; border-radius: 6px; color: #dff2ff;
    font-size: 13px; text-align: center; box-shadow: 0 0 18px #3aa0ff88, inset 0 0 12px #3aa0ff44; pointer-events: none; }
  #sysWin .sys-title { font-weight: 800; letter-spacing: .2em; font-size: 11px; color: #8fd3ff; margin-bottom: 2px; }
  #sysWin.pop { animation: pop .35s ease-out; }
  @keyframes pop { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { #sysWin.pop { animation: none; } }
  .big-ic { font-size: 28px; }
  .link { display: inline-flex; align-items: center; gap: 5px; margin: 0 6px 4px 0; padding: 2px 8px; border-radius: 8px; background: #ffffff10; border: 1px solid var(--border); font-size: 13px; }
  .link small { color: #8fd3ff; }
  .syscard { position: relative; padding: 10px 12px 12px; border: 1px solid #5fb8ffaa; border-radius: 10px; background: linear-gradient(180deg, #0c2440ee, #071423ee);
    box-shadow: 0 0 14px #3aa0ff44, inset 0 0 18px #3aa0ff22; }
  .syscard.red { border-color: #ff6060aa; background: linear-gradient(180deg, #3a0c12ee, #1c060aee); box-shadow: 0 0 14px #ff404044, inset 0 0 18px #ff404022; }
  .syscard.gold { border-color: #f0b54acc; box-shadow: 0 0 16px #f0b54a55, inset 0 0 18px #f0b54a22; }
  .sc-top { display: flex; justify-content: space-between; font-size: 10px; letter-spacing: .25em; color: #8fd3ff; font-weight: 800; margin-bottom: 6px; }
  .syscard.red .sc-top { color: #ff9a9a; }
  .sc-rank { letter-spacing: .1em; padding: 0 6px; border-radius: 4px; border: 1px solid currentColor; }
  .sc-fx { margin: 6px 0; font-size: 12px; color: #bfe6ff; }
  .sc-fx b { color: #fff; }
  .lore { margin-top: 8px; padding-top: 6px; border-top: 1px dashed #ffffff22; font: italic 12.5px/1.45 Georgia, serif; color: #d9cfb8; }
  .slot[data-slot] { cursor: pointer; }
  .inv { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 5px; margin-top: 4px; }
  .inv .cell { position: relative; aspect-ratio: 1; border-radius: 8px; border: 1px solid #5fb8ff55; background: linear-gradient(180deg, #13263c, #0a1626); display: flex; align-items: center; justify-content: center; padding: 0; color: #fff; }
  .inv .cell span { font-size: 22px; line-height: 1; }
  .inv .cell b { position: absolute; right: 3px; bottom: 1px; font-size: 10px; text-shadow: 0 1px 2px #000; }
  .inv .cell i { position: absolute; left: 3px; top: 1px; font-size: 9px; font-style: normal; color: #8fd3ff; font-weight: 800; }
  .inv .cell.empty { background: #0a142088; border-style: dashed; border-color: #5fb8ff22; }
  .status { margin-top: 10px; padding: 10px 12px; border: 1px solid #6fc3ff66; border-radius: 10px; background: linear-gradient(180deg, #0e2a4a55, #0a1a3333); }
  .st-head { display: flex; justify-content: space-between; font-weight: 800; letter-spacing: .12em; color: #8fd3ff; font-size: 12px; margin-bottom: 4px; }
  .small { font-size: 12px; margin-bottom: 4px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 4px 0 6px; }
  .stats span { display: flex; flex-direction: column; align-items: center; padding: 4px 0; border-radius: 8px; background: #ffffff0d; }
  .stats small { color: var(--muted); font-size: 10px; } .stats b { font-size: 15px; }
  .gear { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 6px 0; }
  .slot { display: flex; flex-direction: column; padding: 5px 8px; border-radius: 8px; background: #ffffff0a; border: 1px solid #ffffff14; font-size: 12px; min-width: 0; }
  .slot small { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .05em; }
  .slot b { font-size: 12.5px; overflow-wrap: anywhere; }
  #modal { position: fixed; inset: 0; z-index: 50; background: #000a; display: flex; align-items: center; justify-content: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  #modal[hidden] { display: none; }
  #modal .box { width: min(100%, 460px); background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; box-shadow: 0 10px 40px #000a; }
  #modal h3 { margin: 0 0 6px; font-size: 16px; }
  #modal p { margin: 0 0 8px; color: var(--muted); font-size: 13px; }
  #modal textarea { width: 100%; height: 120px; resize: vertical; background: #0b120e; color: var(--text); border: 1px solid var(--border); border-radius: 8px; font: 11px/1.3 ui-monospace, monospace; padding: 8px; }
  .modal-row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
  .modal-row button { height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel-2); font-weight: 600; }
  #modalOk { background: var(--accent); color: #2a1d05; border-color: var(--accent); }
  .portrait { width: 72px; height: 72px; border-radius: 12px; border: 2px solid #ffffff22; image-rendering: pixelated; flex: none; }
  .skills { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; }
  .skill { display: grid; grid-template-columns: 1fr auto; font-size: 12.5px; }
  .skill b { color: #ffd76a; font-weight: 700; }
  .skill .bar { grid-column: 1 / -1; margin-top: 2px; }
  .quest { font-size: 13px; padding: 6px 8px; border-radius: 8px; background: #f0b54a1a; border: 1px solid #f0b54a55; }
  .quest.done { opacity: .7; text-decoration: line-through; }
  .hint { text-align: center; color: var(--muted); font-size: 12px; margin: 8px 0 0; }

  #roster { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--border); font-size: 13px; }
  .chip.sel { border-color: var(--accent); background: var(--panel-2); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 2px solid #fff; flex: none; }
  .dot.big { width: 18px; height: 18px; }

  #inspector { margin-top: 10px; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; }
  .insp-head { display: flex; align-items: center; gap: 10px; }
  .insp-head b { font-size: 17px; }
  .tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px; }
  .tag { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: #ffffff12; color: var(--muted); }
  .mood { margin-left: auto; font-size: 26px; }
  .thought { margin: 10px 0 6px; padding: 8px 10px; background: #ffffff0d; border-radius: 10px; font-style: italic; }
  .doing { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .bars { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 14px; }
  .lbl { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .bar { height: 7px; background: #0005; border-radius: 4px; overflow: hidden; margin: 2px 0 5px; }
  .bar > i { display: block; height: 100%; transition: width .3s linear; }
  .sec { margin-top: 10px; font-size: 13px; }
  .sec h4 { margin: 0 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  .sec ul { margin: 0; padding-left: 18px; }
  .score, .rel { display: inline-flex; align-items: center; gap: 5px; margin: 0 6px 4px 0; padding: 2px 8px; border-radius: 8px; background: #ffffff0d; }
  .score.win { background: #f0b54a33; color: var(--accent); font-weight: 600; }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); font-size: 13px; text-align: center; margin: 4px 0; }
  footer { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; color: var(--muted); font-size: 12px; }
  footer button { height: 32px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="row">
      <div id="clock">Tag 1 · 06:00</div>
      <div class="ctrls" id="speed">
        <button data-speed="0" aria-label="Pause">⏸</button>
        <button data-speed="1" class="active">1x</button>
        <button data-speed="2">2x</button>
        <button data-speed="5">5x</button>
      </div>
    </div>
    <div id="realm"></div>
    <div id="stats"></div>
    <ol id="log" aria-live="polite"></ol>
  </header>

  <div id="mapWrap">
    <canvas id="map"></canvas>
    <canvas id="minimap" aria-label="Minikarte – antippen zum Springen"></canvas>
    <div id="sysWin" hidden></div>
    <button id="soundBtn" aria-label="Ton ein/aus">🔇</button>
    <button id="chronikBtn" class="mapBtn" style="top:56px" aria-label="Chronik der Geschichte">📖</button>
    <button id="cineBtn" class="mapBtn" style="top:104px" aria-label="Erzähler-Modus">🎬</button>
    <div id="narr" hidden></div>
    <div id="rift" hidden><canvas id="riftCv"></canvas><div id="riftHud"></div><button id="riftClose" class="mapBtn" style="top:8px" aria-label="Zurück zur Karte">✕</button></div>
    <div id="chapter" hidden><div class="ch-num"></div><div class="ch-title"></div><div class="ch-text"></div><div class="ch-tap">antippen zum Weiterspielen</div></div>
    <div id="zoomBtns">
      <button data-z="1.25" aria-label="Hineinzoomen">+</button>
      <button data-z="0.8" aria-label="Herauszoomen">−</button>
      <button id="homeBtn" aria-label="Zum Lager">⌂</button>
    </div>
  </div>
  <p class="hint">Wischen = verschieben · zwei Finger = zoomen · alles antippen für Infos · Minikarte antippen = hinspringen</p>

  <section id="roster" aria-label="Siedler"></section>
  <section id="inspector" aria-live="polite"></section>

  <footer>
    <span id="seedInfo"></span>
    <span id="saveInfo"></span>
    <button id="moreBtn">⚙️ Mehr</button>
    <span id="more" hidden>
      <button id="styleBtn">🎨 Figuren: Pixel</button>
      <button id="exportBtn" title="Nur nötig, um auf einem anderen Gerät weiterzuspielen">📤 Kopie</button>
      <button id="importBtn">📥 Kopie laden</button>
      <button id="newWorld">🌍 Neue Welt</button>
    </span>
  </footer>
</div>

<div id="modal" hidden>
  <div class="box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h3 id="modalTitle"></h3>
    <p id="modalText"></p>
    <div id="modalHtml" hidden></div>
    <textarea id="modalArea" spellcheck="false" aria-label="Spielstand"></textarea>
    <div class="modal-row"><button id="modalOk">OK</button><button id="modalClose">Schließen</button></div>
  </div>
</div>

<script>
'use strict';
/* =====================================================================
 * 1) KONFIGURATION
 * Alle Spielwerte an einer Stelle. Neue Gebäude, Klassen, Fähigkeiten
 * werden hier ergänzt, ohne die Logik weiter unten umbauen zu müssen.
 * ===================================================================== */
const CONFIG = {
  map: { width: 80, height: 80 },
  time: {
    minutesPerSecond: 4,    // bei 1x: 1 echte Sekunde = 4 Spielminuten (1 Tag = 6 Minuten)
    startHour: 6,
    nightStart: 22,
    nightEnd: 6,
  },
  speeds: [0, 1, 2, 5],
  npc: {
    moveSpeed: 0.25,        // Kacheln pro Spielminute
    carryCapacity: 5,
    startHunger: 25,
    startEnergy: 90,
    hungerPerMin: 0.1,      // 0 = satt, 100 = am Verhungern
    energyPerMin: 0.06,
    workEnergyPerMin: 0.04,
    sleepEnergyPerMin: 0.22,
    houseSleepBonus: 1.5,
    eatThreshold: 55,
    criticalHunger: 85,
    tiredThreshold: 25,
    criticalEnergy: 8,
    socialPerMin: 0.05,
    nightSleepBelow: 95,
    wakeEnergy: 80,
  },
  resources: {
    treeWood: 4,
    chopMinutes: 15,
    treeRegrowMinutes: 2 * 1440,
    bushMaxBerries: 6,
    berryRegrowMinutes: 80,
    eatMinutes: 5,
    berryFood: 15,
    bushDensity: 0.022,
    rockStone: 8,           // Stein pro Felsen
    mineMinutes: 25,        // Minuten pro Stein     // Anteil der Kacheln mit Beerensträuchern
  },
  buildings: {
    house:  { name: 'Haus', cost: { wood: 20 }, work: 240, beds: 2 },
    smithy: { name: 'Schmiede', cost: { wood: 30 }, work: 360, beds: 0 },
    market: { name: 'Marktplatz', cost: { wood: 25 }, work: 240, beds: 0 },
    tower:  { name: 'Wachturm', cost: { wood: 10, stone: 15 }, work: 240, beds: 0, range: 6.5 },
    tavern: { name: 'Taverne', cost: { wood: 25, stone: 10, coins: 20 }, work: 300, beds: 0 },
    temple: { name: 'Tempel', cost: { wood: 15, stone: 30, coins: 40 }, work: 420, beds: 0 },
    castle: { name: 'Burg', cost: { wood: 80, crystals: 6 }, work: 600, beds: 4, size: 3 },
    forsthaus:   { name: 'Forsthaus', cost: { wood: 25, stone: 5 }, work: 260, beds: 0 },
    bauernhof:   { name: 'Bauernhof', cost: { wood: 30 }, work: 300, beds: 0 },
    gildenhalle: { name: 'Gildenhalle', cost: { wood: 40, stone: 20, crystals: 3 }, work: 420, beds: 0 },
    lagerhaus:   { name: 'Lagerhaus', cost: { wood: 30, stone: 8 }, work: 280, beds: 0 },
  },
  farming: { growMinutes: 1440, harvestFood: 6, foodPerMeal: 40, plantMinutes: 40, harvestMinutes: 20 },
  monsters: { fromDay: 3, maxAlive: 6, spawnChance: 0.2, growthPerDay: 0.15 },
  // Berufe der Arbeiter: Gewichte verändern, welche Tätigkeit bevorzugt wird; hat = Kopfbedeckung
  professions: {
    settler:    { name: 'Siedler', weights: {}, hat: null },
    holzfaeller:{ name: 'Holzfäller', weights: { gatherWood: 1.5, plantField: 0.3, harvest: 0.6, mineStone: 0.4 }, hat: 'cap', share: 0.35 },
    bauer:      { name: 'Bauer', weights: { plantField: 2, harvest: 2, gatherWood: 0.6, mineStone: 0.3 }, hat: 'straw', share: 0.3 },
    handwerker: { name: 'Handwerker', weights: { build: 1.6, gatherWood: 1.1 }, hat: 'band', share: 0.2 },
    steinmetz:  { name: 'Steinmetz', weights: { mineStone: 2, gatherWood: 0.6 }, hat: 'miner', share: 0.15 },
  },
  population: {

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

class World {
  constructor(cfg, rng) {
    this.cfg = cfg;
    this.w = cfg.map.width;
    this.h = cfg.map.height;
    this.tiles = [];
    this.gates = [];
    this.dirty = true;
    this.dirtyTiles = new Set(); // geänderte Kacheln für den Boden-Zwischenspeicher
    this.camp = generateMap(this, rng);
  }
  inBounds(x, y) { return x >= 0 && y >= 0 && x < this.w && y < this.h; }
  tile(x, y) { return this.inBounds(x, y) ? this.tiles[y * this.w + x] : null; }
  walkable(x, y) { const t = this.tile(x, y); return !!t && TILE_DEFS[t.type].walkable; }
  setType(t, type) { t.type = type; t.timer = 0; this.dirty = true; this.dirtyTiles.add(t); }

  /** Breitensuche über begehbare Kacheln; goal(x, y) liefert ein Ziel, wenn (x, y) passt. */
  bfs(sx, sy, goal, maxNodes = Infinity) {
    const start = { x: Math.round(sx), y: Math.round(sy) };
    if (!this.inBounds(start.x, start.y)) return null;
    const prev = new Int32Array(this.w * this.h).fill(-2);
    const startIdx = start.y * this.w + start.x;
    prev[startIdx] = -1;
    const queue = [startIdx];
    for (let head = 0; head < queue.length && head < maxNodes; head++) {
      const idx = queue[head];
      const x = idx % this.w, y = (idx / this.w) | 0;
      const target = goal(x, y);
      if (target) {
        const path = [];
        for (let i = idx; i !== startIdx; i = prev[i]) path.push({ x: i % this.w, y: (i / this.w) | 0 });
        path.reverse();
        return { path, stand: { x, y }, target };
      }
      for (const [dx, dy] of DIRS) {
        const nx = x + dx, ny = y + dy;
        if (!this.walkable(nx, ny)) continue;
        const ni = ny * this.w + nx;
        if (prev[ni] !== -2) continue;
        prev[ni] = idx;
        queue.push(ni);
      }
    }
    return null;
  }

  /** Nächster Standplatz direkt neben einer Kachel, die isTarget(tile) erfüllt. */
  findAdjacent(sx, sy, isTarget, maxNodes) {
    return this.bfs(sx, sy, (x, y) => {
      for (const [dx, dy] of DIRS) {
        const t = this.tile(x + dx, y + dy);
        if (t && isTarget(t)) return t;
      }
      return null;
    }, maxNodes);
  }

  /** Läuft jede Spielminute: Beeren und Bäume wachsen nach. */
  update() {
    const r = this.cfg.resources;
    for (const t of this.tiles) {
      if (t.type === 'bush' && t.berries < r.bushMaxBerries) {
        if (++t.timer >= r.berryRegrowMinutes) { t.berries++; t.timer = 0; }
      } else if (t.type === 'field') {
        if (t.timer < this.cfg.farming.growMinutes) t.timer += 1;
      } else if (t.type === 'stump') {
        if (++t.timer >= r.treeRegrowMinutes) { this.setType(t, 'tree'); t.wood = r.treeWood; }
      }
    }
  }
}

function generateMap(world, rng) {
  const { w, h } = world;
  const r = world.cfg.resources;
  const ri = (a, b) => a + Math.floor(rng() * (b - a + 1));
  for (let y = 0; y < h; y++)
    for (let x = 0; x < w; x++)
      world.tiles.push({ x, y, type: 'grass', wood: 0, berries: 0, timer: 0, shade: rng(), building: null, traffic: 0 });
  const camp = { x: Math.floor(w / 2), y: Math.floor(h / 2) };
  const far = (x, y, d) => Math.hypot(x - camp.x, y - camp.y) >= d;

  const blob = (cx, cy, radius, type, density = 1, onlyGrass = false) => {
    const R = Math.ceil(radius + 1);
    for (let y = cy - R; y <= cy + R; y++)
      for (let x = cx - R; x <= cx + R; x++) {
        const t = world.tile(x, y);
        if (!t || (onlyGrass && t.type !== 'grass')) continue;
        if (Math.hypot(x - cx, y - cy) + rng() * 1.4 < radius && rng() < density) t.type = type;
      }
  };

  // Seen
  for (let i = 0; i < 5; i++) { const x = ri(4, w - 5), y = ri(4, h - 5); if (far(x, y, 14)) blob(x, y, 3 + rng() * 4, 'water'); }
  // Fluss von oben nach unten, mit Furten
  let rx = rng() < 0.5 ? ri(8, 22) : ri(w - 23, w - 9);
  const fords = new Set();
  for (let y = 0; y < h; y++) {
    rx = clamp(rx + Math.round((rng() - 0.5) * 2.2), 3, w - 4);
    const ford = y % 14 === 7;
    for (let x = rx - 1; x <= rx + 1; x++) {
      const t = world.tile(x, y);
      if (!t) continue;
      t.type = ford ? 'ford' : 'water';
      if (ford) fords.add(t);
    }
  }
  // Wälder und Felsen
  for (let i = 0; i < 34; i++) blob(ri(0, w - 1), ri(0, h - 1), 2 + rng() * 4.5, 'tree', 0.8, true);
  for (let i = 0; i < 12; i++) { const x = ri(2, w - 3), y = ri(2, h - 3); if (far(x, y, 10)) blob(x, y, 1.2 + rng() * 2, 'rock', 0.85, true); }

  // Lichtung mit Lager in der Mitte
  for (let y = camp.y - 6; y <= camp.y + 6; y++)
    for (let x = camp.x - 6; x <= camp.x + 6; x++) {
      const t = world.tile(x, y);
      if (t && Math.hypot(x - camp.x, y - camp.y) <= 5.2) t.type = 'grass';
    }
  world.tile(camp.x, camp.y).type = 'camp';
  // Wäldchen in Reichweite
  for (let i = 0; i < 4; i++) {
    const a = i / 4 * Math.PI * 2 + rng();
    blob(Math.round(camp.x + Math.cos(a) * 8.5), Math.round(camp.y + Math.sin(a) * 8.5), 2.2, 'tree', 0.9, true);
  }
  // Beerensträucher
  const bushes = Math.round(w * h * r.bushDensity);
  let placed = 0, tries = 0;
  while (placed < bushes + 6 && tries++ < 20000) {
    let x, y;
    if (placed < 6) { const a = rng() * Math.PI * 2, d = 4 + rng() * 3; x = Math.round(camp.x + Math.cos(a) * d); y = Math.round(camp.y + Math.sin(a) * d); }
    else { x = ri(0, w - 1); y = ri(0, h - 1); }
    const t = world.tile(x, y);
    if (!t || t.type !== 'grass' || !far(x, y, 3)) continue;
    t.type = 'bush'; placed++;
  }
  // Ruinen: kleine Gruppen alter Säulen
  for (let i = 0; i < 5; i++) {
    const x = ri(5, w - 6), y = ri(5, h - 6);
    if (!far(x, y, 14)) continue;
    for (let k = 0; k < 5; k++) { const t = world.tile(x + ri(-2, 2), y + ri(-2, 2)); if (t && t.type === 'grass') t.type = 'ruin'; }
  }
  for (const t of world.tiles) {
    if (t.type === 'tree') t.wood = r.treeWood;
    if (t.type === 'rock') t.wood = r.rockStone; // Steinvorrat (im Feld 'wood' gespeichert)
    if (t.type === 'bush') t.berries = r.bushMaxBerries;
  }
  // Risse (Tore in eine andere Welt): weit weg, je weiter, desto gefährlicher
  const reach = (x, y) => world.bfs(camp.x, camp.y + 1, (px, py) => Math.abs(px - x) + Math.abs(py - y) === 1 ? true : null);
  tries = 0;
  while (world.gates.length < world.cfg.gates.count && tries++ < 400) {
    const x = ri(4, w - 5), y = ri(4, h - 5), t = world.tile(x, y);
    if (!t || !far(x, y, 16) || world.gates.some(g => Math.hypot(g.x - x, g.y - y) < 14)) continue;
    for (let yy = y - 1; yy <= y + 1; yy++) for (let xx = x - 1; xx <= x + 1; xx++) { const n = world.tile(xx, yy); if (n && n.type !== 'water' && n.type !== 'ford') n.type = 'grass'; }
    if (t.type !== 'grass' || !reach(x, y)) continue;
    t.type = 'gate';
    const d = Math.hypot(x - camp.x, y - camp.y);
    t.gate = { tier: d > 32 ? 3 : d > 24 ? 2 : 1, cleared: 0, failed: 0, name: ['Smaragdriss', 'Aschetor', 'Sternenspalt', 'Nebelpforte', 'Glutschlund'][world.gates.length % 5] };
    world.gates.push(t);
  }
  return camp;
}

class Settlement {
  constructor(sim, camp, opts = {}) {
    this.sim = sim;
    this.camp = camp;
    this.campTile = sim.world.tile(camp.x, camp.y);
    this.campTile.town = this;
    this.id = opts.id || 0; this.name = opts.name || 'Siedlung'; this.capital = !!opts.capital;
    this.color = opts.color || BANNERS[this.id % BANNERS.length]; this.leader = opts.leader || ''; this.founded = opts.founded || 1;
    this.stock = { wood: 0, crystals: 0, food: 0, coins: 0, stone: 0 };
    this.trades = []; // letzte Handelsgeschäfte für die Anzeige
    this.buildings = [];
    this.items = []; // eingelagerte Ausrüstung
    this.site = null;
    this.foundedBy = '';
  }
  get houses() { return this.buildings.filter(b => b.type === 'house'); }
  get smithy() { return this.buildings.find(b => b.type === 'smithy'); }
  get towers() { return this.buildings.filter(b => b.type === 'tower'); }
  get tavern() { return this.buildings.find(b => b.type === 'tavern'); }
  get temple() { return this.buildings.find(b => b.type === 'temple'); }
  get market() { return this.buildings.find(b => b.type === 'market'); }
  get castle() { return this.buildings.find(b => b.type === 'castle'); }
  get forsthaus() { return this.buildings.find(b => b.type === 'forsthaus'); }
  get bauernhof() { return this.buildings.find(b => b.type === 'bauernhof'); }
  get gildenhalle() { return this.buildings.find(b => b.type === 'gildenhalle'); }
  get lagerhaus() { return this.buildings.find(b => b.type === 'lagerhaus'); }
  /** Ausrüstung ins Lager legen (höchstens 24 Teile – das Schwächste fliegt raus). */
  storeItem(it) {
    if (!it) return;
    (this.items ||= []).push(it);
    if (this.items.length > 24) { this.items.sort((a, b) => b.power - a.power); this.items.length = 24; }
  }
  get members() { return this.sim.npcs.filter(n => n.town === this); }
  get fields() { return this.sim.world.tiles.filter(t => t.type === 'field'); }
  canAfford(cost) { return Object.entries(cost).every(([k, v]) => (this.stock[k] || 0) >= v); }
  pay(cost) { for (const [k, v] of Object.entries(cost)) this.stock[k] -= v; }

  addTrade(text) { this.trades.unshift(`T${this.sim.day} ${this.sim.clock} · ${text}`); if (this.trades.length > 6) this.trades.pop(); }

  /** Felder zählen (alle 15 Minuten, damit es schnell bleibt). */
  recount() {
    let f = 0, r = 0;
    const towns = this.sim.towns || [this];
    for (const t of this.sim.world.tiles) if (t.type === 'field') {
      let own = towns[0], bd = Infinity; // Feld gehört zur nächsten Siedlung
      for (const tw of towns) { const d = Math.hypot(tw.camp.x - t.x, tw.camp.y - t.y); if (d < bd) { bd = d; own = tw; } }
      if (own !== this) continue;
      f++; if (t.timer >= CONFIG.farming.growMinutes && !t.harvester) r++;
    }
    this.fieldCount = f; this.ripe = r;
  }

  update() {
    if (this.fieldCount === undefined || this.sim.minutes % 15 === 0) this.recount();
    if (this.site || this.sim.minutes % 10 !== 0) return;
    // Wunschliste nach Wichtigkeit; gebaut wird das erste, das bezahlbar ist
    const sim = this.sim, H = this.houses.length, free = this.houses.reduce((a, h) => a + h.beds - h.residents.length, 0), wants = [];
    if (this.capital && sim.kingdom && !this.castle && sim.minutes >= (this.nextCastleTry || 0)) wants.push('castle');
    if (this.capital && !this.smithy && H >= 3 && this.stock.crystals >= 1) wants.push('smithy');
    if (this.capital && this.smithy && !this.market && H >= 8) wants.push('market');
    if (sim.day >= CONFIG.monsters.fromDay && H >= 3 && this.towers.length < Math.ceil((H + 1) / 7)) wants.push('tower');
    if (this.capital && !this.tavern && H >= 12) wants.push('tavern');
    if (this.capital && !this.temple && H >= 16) wants.push('temple');
    if (!this.lagerhaus && H >= 3) wants.push('lagerhaus');
    if (!this.forsthaus && H >= 4) wants.push('forsthaus');
    if (!this.bauernhof && H >= 5) wants.push('bauernhof');
    if (this.capital && sim.guild && !this.gildenhalle && H >= 6) wants.push('gildenhalle');
    if (free < 2) wants.push('house');
    this.stoneWanted = wants.some(t => (CONFIG.buildings[t].cost.stone || 0) > this.stock.stone);
    for (const type of wants) if (this.canAfford(CONFIG.buildings[type].cost) && this.startConstruction(type)) return;
    this.tryUpgrade(free);
  }

  /* ---- Gebäude-Stufen: vorhandene Gebäude ausbauen (Stufe I → III) ---- */
  upgradeCost(b) {
    const L = b.level || 1;
    return b.type === 'house' ? { wood: 14 + L * 6, stone: 4 * L } : { wood: 18 * L, stone: 10 * L, ...(b.type === 'smithy' ? { crystals: 2 * L } : {}) };
  }
  tryUpgrade(free) {
    const order = ['smithy', 'gildenhalle', 'lagerhaus', 'tower', 'bauernhof', 'forsthaus', 'market', 'temple', 'tavern', 'house'], c = this.camp;
    const cands = this.buildings.filter(b => order.includes(b.type) && (b.level || 1) < 3)
      .sort((a, b) => order.indexOf(a.type) - order.indexOf(b.type) || (a.level || 1) - (b.level || 1)
        || Math.hypot(a.tile.x - c.x, a.tile.y - c.y) - Math.hypot(b.tile.x - c.x, b.tile.y - c.y));
    for (const b of cands) {
      if (b.type === 'house' ? free >= 2 && this.stock.wood < 70 : this.stock.wood < 45) continue; // Reserve fürs Nötige
      const cost = this.upgradeCost(b);
      if (!this.canAfford(cost)) continue;
      this.pay(cost);
      this.site = { type: b.type, tile: b.tile, tiles: [b.tile], progress: 0, work: Math.round(CONFIG.buildings[b.type].work * 0.6 * (b.level || 1)), upgrade: b, town: this, startedDay: this.sim.day };
      b.tile.siteRef = this.site;
      this.sim.log(`🔧 ${CONFIG.buildings[b.type].name}${b.type === 'house' ? ' Nr. ' + b.id : ''} wird ausgebaut – bald Stufe ${roman((b.level || 1) + 1)}!`, null, true);
      return true;
    }
    return false;
  }
  completeUpgrade() {
    const site = this.site, sim = this.sim, b = site.upgrade, def = CONFIG.buildings[b.type];
    b.level = (b.level || 1) + 1; b.tile.siteRef = null; this.site = null;
    if (b.type === 'house') b.beds = (def.beds || 2) + b.level - 1;
    const builders = sim.npcs.filter(n => n.task && n.task.actionId === 'build');
    for (const n of builders) { n.gainXp('building', 20); if (n.awakened) n.addXp(sim, 20); }
    sim.log(`⬆️ ${def.name}${b.type === 'house' ? ' Nr. ' + b.id : ''} ist jetzt Stufe ${roman(b.level)}!${b.type === 'house' ? ` (${b.beds} Betten)` : ''}`, null, true);
    sim.emit('system', `GEBÄUDE AUFGEWERTET: ${def.name} → Stufe ${roman(b.level)}`);
    sim.float(b.tile.x, b.tile.y, `⬆️ Stufe ${roman(b.level)}`, '#f0b54a');
    if (b.type === 'house') sim.emit('buildingCompleted', b); // neue Betten → Neue ziehen ein
  }

  startConstruction(type) {
    const def = CONFIG.buildings[type];
    const tile = type === 'castle' ? this.findCastleSpot() : this.findBuildSpot(type === 'tower' ? 4 + Math.sqrt(this.houses.length) * 1.6 : 0);
    if (!tile) { if (type === 'castle') this.nextCastleTry = this.sim.minutes + 240; return false; }
    this.pay(def.cost);
    const tiles = type === 'castle' ? this.footprint(tile) : [tile];
    this.site = { type, tile, tiles, progress: 0, work: def.work, startedDay: this.sim.day, town: this };
    for (const t of tiles) { this.sim.world.setType(t, 'site'); t.siteRef = this.site; }
    if (type === 'castle') this.sim.log(`🏰 Der Bau der Burg von ${this.sim.kingdom.name} beginnt!`, null, true);
    else this.sim.log(type === 'smithy' ? '⚒️ Die Siedler beginnen mit dem Bau einer Schmiede!' : `🪓 ${def.cost.wood} Holz beisammen – die Siedler bauen gemeinsam ein ${def.name}!`, null, true);
    this.sim.emit('constructionStarted', this.site);
    return true;
  }

  completeSite() {
    if (this.site.upgrade) return this.completeUpgrade();
    const site = this.site, sim = this.sim;
    const def = CONFIG.buildings[site.type];
    for (const t of site.tiles || [site.tile]) { sim.world.setType(t, site.type); t.siteRef = null; if (t !== site.tile) t.part = site.tile; }
    const builders = sim.npcs.filter(n => n.task && n.task.actionId === 'build');
    const b = { id: this.buildings.length + 1, level: 1, type: site.type, tile: site.tile, beds: def.beds || 0, sleepers: new Set(), residents: [],
      builtDay: sim.day, builtClock: sim.clock, builders: builders.map(n => n.name), town: this };
    site.tile.building = b;
    this.buildings.push(b);
    this.site = null;
    sim.log(site.type === 'castle' ? `🏰 Die Burg von ${sim.kingdom ? sim.kingdom.name : this.name} erhebt sich über dem Land!` : site.type === 'smithy' ? '⚒️ Die Schmiede ist fertig! Jetzt kann aus Kristallen Ausrüstung entstehen.' : `🏠 ${def.name} Nr. ${this.houses.length} in ${this.name} ist fertig!`, null, true);
    if (site.type === 'castle') sim.emit('system', 'Die Burg ist vollendet!');
    if (site.type === 'smithy') sim.emit('system', 'Neues Gebäude: Schmiede');
    sim.float(site.tile.x, site.tile.y, '🎉 Fertig!', '#f0b54a');
    for (const n of builders) { // Richtfest: alle Helfer bekommen einen Bonus
      n.remember(sim, `Hat Haus Nr. ${b.id} mitgebaut 🔨`); n.housesBuilt = (n.housesBuilt || 0) + 1;
      n.gainXp('building', 30); if (n.awakened) n.addXp(sim, 30);
    }
    if (builders.length) sim.log(`🎊 Richtfest! ${builders.map(n => n.name).join(', ')} ${builders.length > 1 ? 'bekommen' : 'bekommt'} Bau-Erfahrung.`, null, false);
    if (site.type === 'castle' && sim.kingdom) { const r = sim.npcs.find(n => n.id === sim.kingdom.regentId); if (r) { if (r.home) r.home.residents = r.home.residents.filter(x => x !== r); sim.moveIn(r, b); } }
    sim.emit('buildingCompleted', b);
  }

  footprint(center) {
    const out = [];
    for (let y = center.y - 1; y <= center.y + 1; y++) for (let x = center.x - 1; x <= center.x + 1; x++) out.push(this.sim.world.tile(x, y));
    return out;
  }

  /** Platz für die Burg: 3×3 freie Wiese, ohne dass Wege abgeschnitten werden. */
  findCastleSpot() {
    const { world } = this.sim, c = this.camp, W = world.w;
    const flood = blocked => { let cnt = 0; world.bfs(c.x, c.y + 1, (x, y) => { if (!blocked.has(y * W + x)) cnt++; return null; }); return cnt; };
    const base = flood(new Set());
    const cands = [];
    for (let y = c.y - 14; y <= c.y + 14; y++) for (let x = c.x - 14; x <= c.x + 14; x++) {
      const d = Math.hypot(x - c.x, y - c.y);
      if (d < 4 || d > 14) continue;
      const fp = this.footprint({ x, y });
      if (fp.some(t => !t || t.type !== 'grass')) continue;
      cands.push({ x, y, d });
    }
    cands.sort((a, b) => a.d - b.d);
    for (const cd of cands.slice(0, 12)) {
      const blocked = new Set(this.footprint(cd).map(t => t.y * W + t.x));
      const saved = world.walkable.bind(world);
      world.walkable = (x, y) => !blocked.has(y * W + x) && saved(x, y);
      const after = flood(blocked);
      world.walkable = saved;
      if (after >= base - 12) return world.tile(cd.x, cd.y);
    }
    return null;
  }

  /** Freie Wiese nahe am Lager. Raster mit Abstand 2 hält Wege frei. */
  findBuildSpot(minD = 0) {
    const { world, npcs } = this.sim;
    const c = this.camp, R = 30;
    if (this.sim.minutes < (this.nextSpotTry || 0)) return null;
    const reach = new Uint8Array(world.w * world.h);
    world.bfs(c.x, c.y + 1, (x, y) => { reach[y * world.w + x] = 1; return null; });
    let best = null, bestD = Infinity;
    for (let y = c.y - R; y <= c.y + R; y++)
      for (let x = c.x - R; x <= c.x + R; x++) {
        const dx = x - c.x, dy = y - c.y;
        if (dx % 2 !== 0 || dy % 2 !== 0 || (dx === 0 && dy === 0)) continue;
        const t = world.tile(x, y);
        if (!t || t.type !== 'grass') continue;
        const d = Math.hypot(dx, dy * 1.1);
        if (d >= bestD || d < minD) continue; // Wachtürme lieber am Ortsrand
        if (npcs.some(n => Math.round(n.x) === x && Math.round(n.y) === y)) continue;
        if (!DIRS.some(([ax, ay]) => world.walkable(x + ax, y + ay))) continue;
        if (DIRS.some(([ax, ay]) => world.inBounds(x + ax, y + ay) && reach[(y + ay) * world.w + x + ax])) { best = t; bestD = d; }
      }
    if (!best) this.nextSpotTry = this.sim.minutes + 120;
    return best;
  }
}

/* =====================================================================
 * 5) AKTIONEN (Utility-KI)
 * Jede Aktion bewertet sich selbst (score), erklärt ihre Absicht (think)
 * und plant Schritte (move / act). Neue Tätigkeiten = weitere defineAction.
 * ===================================================================== */
const ACTIONS = {};
function defineAction(def) { ACTIONS[def.id] = { interruptible: true, ...def }; }

const move = path => ({ kind: 'move', path });
const act = (tick, opts = {}) => ({ kind: 'act', tick, t: 0, ...opts });
const pick = (sim, arr) => arr[Math.floor(sim.rng() * arr.length)];
const houseCost = () => CONFIG.buildings.house.cost.wood;
const woodCarried = sim => sim.npcs.reduce((a, n) => a + n.inventory.wood, 0);

defineAction({
  id: 'eat', label: 'isst Beeren', short: 'Essen', start: 'geht Beeren essen', icon: '🫐',
  interruptible: false,
  score(n, sim) {
    if (n.hunger >= CONFIG.npc.eatThreshold) return 50 + n.hunger * 0.5;
    const h = sim.hourFloat;
    if (h >= 20 && h < 22 && n.hunger >= 35) return 68; // vorausplanen: vor dem Schlafen noch essen
    return 0;
  },
  urgent: n => n.hunger >= CONFIG.npc.criticalHunger,
  think: (n, sim) => n.hunger >= CONFIG.npc.eatThreshold
    ? pick(sim, [`Mein Magen knurrt (Hunger ${Math.round(n.hunger)}). Zeit für Beeren.`, 'Erst essen, dann weiterarbeiten.', 'Ich brauche etwas zu essen, sonst schaffe ich nichts.'])
    : 'Ich esse lieber jetzt noch etwas, bevor ich schlafen gehe.',
  plan(n, sim) {
    if (n.town.stock.food > 0) { // Brot aus dem Vorrat am Lager
      const camp = sim.world.findAdjacent(n.x, n.y, t => t === n.town.campTile, 6000);
      if (camp) return [move(camp.path), act((n, sim, s) => {
        if (s.t % CONFIG.resources.eatMinutes !== 0) return;
        if (n.town.stock.food <= 0) return 'done';
        n.town.stock.food--;
        n.hunger = Math.max(0, n.hunger - CONFIG.farming.foodPerMeal);
        sim.float(n.town.camp.x, n.town.camp.y, '🍞', '#fff');
        if (n.hunger <= 10) return 'done';
      })];
    }
    const res = sim.world.findAdjacent(n.x, n.y, t => t.type === 'bush' && t.berries > 0);
    if (!res) return null;
    const bush = res.target;
    return [move(res.path), act((n, sim, s) => {
      if (s.t % CONFIG.resources.eatMinutes !== 0) return;
      if (bush.type !== 'bush' || bush.berries <= 0) return 'done';
      bush.berries--; bush.timer = 0;
      n.hunger = Math.max(0, n.hunger - CONFIG.resources.berryFood);
      sim.float(bush.x, bush.y, '😋', '#fff');
      n.gainXp('gathering', 1);
      if (n.hunger <= 5) return 'done';
    }, { face: bush })];
  },
});

defineAction({
  id: 'sleep', label: 'schläft', short: 'Schlafen', start: 'legt sich schlafen', icon: '💤',
  score(n, sim) {
    const c = CONFIG.npc;
    if (n.energy < c.tiredThreshold) return 60 + (100 - n.energy) * 0.4;
    if (sim.isNight && n.energy < c.nightSleepBelow) return 65;
    return 0;
  },
  urgent: n => n.energy <= CONFIG.npc.criticalEnergy,
  think(n, sim) {
    if (n.energy < CONFIG.npc.tiredThreshold && !sim.isNight) return 'Ich bin völlig erschöpft, ich muss mich hinlegen.';
    if (n.bed && n.bed === n.home) return `Es ist spät. Ab nach Hause in Haus Nr. ${n.bed.id}.`;
    if (n.bed) return `Ich darf heute in Haus Nr. ${n.bed.id} übernachten.`;
    return 'Noch kein Dach über dem Kopf … ich schlafe am Lagerfeuer.';
  },
  plan(n, sim) {
    const free = h => h.sleepers.size < h.beds;
    const house = n.home && free(n.home) ? n.home : n.town.houses.find(free);
    const steps = [];
    if (house) {
      const res = sim.world.findAdjacent(n.x, n.y, t => t === house.tile);
      if (res) { steps.push(move(res.path)); house.sleepers.add(n); n.bed = house; }
    }
    if (!n.bed) { // ohne Haus: ans Lagerfeuer
      const res = sim.world.findAdjacent(n.x, n.y, t => t === n.town.campTile);
      if (res && res.path.length < 40) steps.push(move(res.path));
    }
    steps.push(act((n, sim) => {
      n.sleeping = true;
      n.inside = n.bed;
      const c = CONFIG.npc;
      n.energy = Math.min(100, n.energy + c.sleepEnergyPerMin * (n.bed ? c.houseSleepBonus : 1));
      if (!sim.isNight && n.energy >= c.wakeEnergy) return 'done';
    }));
    return steps;
  },
  describe: n => n.bed ? `geht ins Haus Nr. ${n.bed.id} schlafen` : 'schläft am Lagerfeuer',
  onEnd(n) {
    if (n.bed) n.bed.sleepers.delete(n);
    n.bed = null; n.inside = null; n.sleeping = false;
  },
});

defineAction({
  id: 'build', label: 'baut am Haus', short: 'Bauen', start: 'hilft beim Hausbau', icon: '🔨',
  score: (n, sim) => n.town.site ? 50 : 0,
  think(n, sim) {
    const site = n.town.site;
    const p = site ? Math.floor(site.progress / site.work * 100) : 0;
    const helpers = sim.npcs.filter(o => o !== n && o.task && o.task.actionId === 'build').length;
    return helpers ? `${helpers} ${helpers === 1 ? 'andere baut' : 'andere bauen'} schon, ich packe mit an! (${p} %)` : `Das neue Haus ist zu ${p} % fertig. Ich baue weiter.`;
  },
  plan(n, sim) {
    const site = n.town.site;
    const res = sim.world.findAdjacent(n.x, n.y, t => t.siteRef === site); // bei der Burg: irgendeine Kachel des 3×3-Bauplatzes
    if (!res) return null;
    return [move(res.path), act((n, sim) => {
      if (n.town.site !== site) return 'done';
      site.progress += n.workRate('build');
      n.gainXp('building', 1);
      if (site.progress >= site.work) { n.town.completeSite(); return 'done'; }
    }, { work: true, face: site.tile })];
  },
});

defineAction({
  id: 'deliver', label: 'bringt Holz ins Lager', short: 'Abliefern', start: 'bringt Holz zum Lager', icon: '📦',
  score(n, sim) {
    const w = n.inventory.wood + (n.inventory.stone || 0);
    if (w >= CONFIG.npc.carryCapacity) return 45;
    if (w > 0 && !n.town.site && n.town.stock.wood + w >= houseCost()) return 48; // reicht schon fürs Haus
    return w > 0 ? 20 : 0;
  },
  think(n, sim) {
    if (n.inventory.wood < CONFIG.npc.carryCapacity && n.town.stock.wood + n.inventory.wood >= houseCost())
      return 'Mit meinem Holz reicht es schon für ein Haus! Schnell zum Lager.';
    return 'Meine Arme sind voll, ab zum Lager.';
  },
  plan(n, sim) {
    const res = sim.world.findAdjacent(n.x, n.y, t => t === n.town.campTile);
    if (!res) return null;
    return [move(res.path), act((n, sim) => {
      const amount = n.inventory.wood, stone = n.inventory.stone || 0;
      n.town.stock.wood += amount; n.town.stock.stone += stone;
      n.inventory.wood = 0; n.inventory.stone = 0;
      sim.float(n.town.camp.x, n.town.camp.y, stone ? `+${stone} 🪨` : `+${amount} 🪵`, '#f0b54a');
      if (amount) sim.log(`legt ${amount} Holz ins Lager (${n.town.stock.wood}/${houseCost()})`, n);
      if (stone) sim.log(`bringt ${stone} Stein ins Lager (${n.town.stock.stone})`, n);
      return 'done';
    })];
  },
});

defineAction({
  id: 'gatherWood', label: 'hackt Holz', short: 'Holz', start: 'geht Holz hacken', icon: '🪓',
  score: (n, sim) => n.inventory.wood < CONFIG.npc.carryCapacity && !n.inventory.stone ? 30 + (n.town.stock.wood >= houseCost() * 0.6 ? 4 : 0) : 0,
  think(n, sim) {
    const need = Math.max(0, houseCost() - n.town.stock.wood - woodCarried(sim));
    if (n.town.site) return 'Fürs übernächste Haus brauchen wir auch Holz.';
    if (need === 0) return 'Wir haben genug Holz für das nächste Haus! Ich sammle schon mal vor.';
    if (need <= 5) return `Nur noch ${need} Holz, dann können wir bauen!`;
    if (n.traits.fleiss > 0.65) return pick(sim, ['Arbeit macht mir Spaß. Ich hole Holz.', `Noch ${need} Holz bis zum nächsten Haus, packen wir's an.`]);
    return `Das Lager braucht noch ${need} Holz.`;
  },
  plan(n, sim) {
    const res = sim.world.findAdjacent(n.x, n.y, t => t.type === 'tree' && t.wood > 0);
    if (!res) return null;
    const tree = res.target;
    return [move(res.path), act((n, sim, s) => {
      if (tree.type !== 'tree' || tree.wood <= 0) return 'done';
      tree.hitAt = performance.now(); // nur für die Wackel-Animation
      if (s.t % Math.max(1, Math.round(CONFIG.resources.chopMinutes / n.workRate('chop'))) !== 0) return;
      const amount = Math.min(tree.wood, CONFIG.npc.carryCapacity - n.inventory.wood, n.hasSkill('kraftschlag') ? 2 : 1);
      tree.wood -= amount;
      sim.float(tree.x, tree.y, `+${amount} 🪵`, '#f3d29b');
      sim.emit('chop', tree);
      n.inventory.wood += amount;
      n.gainXp('woodcutting', amount);
      if (tree.wood <= 0) sim.world.setType(tree, 'stump');
      if (n.inventory.wood >= CONFIG.npc.carryCapacity || tree.type !== 'tree') return 'done';
    }, { work: true, face: tree })];
  },
});

defineAction({
  id: 'socialize', label: 'unterhält sich', short: 'Reden', start: 'sucht Gesellschaft', icon: '💬',
  score(n, sim) {
    const need = 100 - n.social;
    if (need < 35 || sim.isNight) return 0;
    const h = sim.hourFloat;
    return need * 0.55 * (0.6 + n.traits.gesellig * 0.8) + (h >= 17 && h < 21 ? 10 : 0);
  },
  think: (n, sim) => n.partner
    ? ((n.relations[n.partner.id] || 0) >= 50 ? `Ich will mit ${n.partner.name} reden – wir sind befreundet.` : `Ich fühle mich etwas einsam. Mal sehen, wie es ${n.partner.name} geht.`)
    : 'Ich brauche Gesellschaft.',
  plan(n, sim) {
    const partner = choosePartner(n, sim);
    if (!partner) return null;
    const pt = sim.world.tile(Math.round(partner.x), Math.round(partner.y));
    const res = sim.world.findAdjacent(n.x, n.y, t => t === pt);
    if (!res || res.path.length > 30) return null;
    n.partner = partner;
    return [move(res.path), act((n, sim, s) => {
      if (Math.hypot(partner.x - n.x, partner.y - n.y) > 2.2 || partner.sleeping || partner.inside) return 'done';
      if (s.t === 1) converse(n, partner, sim);
      n.social = Math.min(100, n.social + (n.hasSkill('frohsinn') ? 5 : 2.5));
      partner.social = Math.min(100, partner.social + 1.2);
      changeRelation(n, partner, 0.6, sim);
      if (s.t >= 20 || n.social >= 98) return 'done';
    }, { face: partner })];
  },
  onEnd(n) { n.partner = null; },
});

/* ---- Landwirtschaft ---------------------------------------------------- */
/** Felder liegen auf demselben Raster wie Häuser (jede 2. Kachel) – so bleiben die Gassen dazwischen immer frei. */
function findFieldSpot(sim, town) {
  const w = sim.world, c = town.camp;
  let best = null, bd = Infinity;
  for (let y = c.y - 24; y <= c.y + 24; y += 2) for (let x = c.x - 24; x <= c.x + 24; x += 2) {
    const t = w.tile(x, y);
    if (!t || t.type !== 'grass') continue;
    const d = Math.hypot(x - c.x, y - c.y);
    if (d < 7 || d >= bd || (t.reserved && sim.minutes - t.reserved < 120)) continue;
    if (DIRS.some(([dx, dy]) => w.walkable(x + dx, y + dy))) { best = t; bd = d; }
  }
  return best;
}

defineAction({
  id: 'plantField', label: 'bestellt ein Feld', short: 'Feld', start: 'legt ein neues Feld an', icon: '🌱',
  score(n, sim) {
    const st = n.town;
    if (st.fieldCount >= Math.max(2, Math.ceil(sim.npcs.length * 0.45)) || sim.isNight) return 0;
    return 33;
  },
  think: n => n.profession === 'bauer' ? 'Ein neues Feld – damit im Winter niemand hungert.' : 'Die Beeren reichen bald nicht mehr. Wir brauchen Felder.',
  plan(n, sim) {
    const spot = findFieldSpot(sim, n.town);
    if (!spot) return null;
    const res = sim.world.findAdjacent(n.x, n.y, t => t === spot, 6000);
    if (!res) return null;
    spot.reserved = sim.minutes;
    return [move(res.path), act((n, sim, s) => {

/* ---- Schmiede und Ausrüstung ------------------------------------------- */
const gearPower = (n, slots = SLOTS) => slots.reduce((a, s) => a + (n.gear[s] ? n.gear[s].power : 0), 0);

function pickGearTarget(sim) {
  const aw = sim.npcs.filter(o => o.awakened).sort((a, b) => gearPower(a) - gearPower(b));
  for (const o of aw) { const slot = SLOTS.find(s => !o.gear[s] && (s !== 'cape' || o.level >= 5)); if (slot) return { npc: o, slot }; }
  if (!aw.length) return null;
  const o = aw[0];
  return { npc: o, slot: SLOTS.slice(0, 4).sort((a, b) => (o.gear[a] ? o.gear[a].power : 0) - (o.gear[b] ? o.gear[b].power : 0))[0] };
}

function rollRarity(n, sim) {
  const w = [60, 28, 9, 2.6, 0.4];
  if (n.cls === 'schmied' || n.cls === 'sternenschmied') { w[0] -= 15; w[1] += 5; w[2] += 7; w[3] += 2.5; w[4] += 0.5; }
  if (n.hasSkill('legendaererFunke')) { w[3] *= 2; w[4] *= 2; }
  const SL = (sim.capital.smithy && sim.capital.smithy.level) || 1; // ausgebaute Schmiede: bessere Chancen
  w[2] += 4 * (SL - 1); w[3] += 1.2 * (SL - 1); w[4] += 0.3 * (SL - 1);
  let r = sim.rng() * w.reduce((a, b) => a + b), tier = 0;
  while (tier < 4 && r > w[tier]) { r -= w[tier]; tier++; }
  if (n.hasSkill('meisterschmied') && sim.rng() < 0.35) tier++;
  if (n.hasSkill('sternenhammer')) tier += sim.rng() < 0.25 ? 2 : 1;
  return Math.min(4, tier);
}

function makeItem(slot, rarity, owner, smith, sim) {
  const R = RARITIES[rarity];
  let base = { armor: 'rüstung', helmet: 'helm', boots: 'stiefel', cape: 'umhang' }[slot], kind = slot;
  if (slot === 'weapon') { const wp = WEAPONS[owner.cls] || WEAPONS.none; kind = wp[0]; base = wp[1]; }
  let name = R.prefix + base;
  if (rarity >= 3) name += ` „${EPITHETS[Math.floor(sim.rng() * EPITHETS.length)]}“`;
  const power = Math.round((3 + smith.level * 0.6) * R.mult * (slot === 'weapon' ? 1.4 : slot === 'cape' ? 0.6 : 1));
  return { slot, kind, rarity, name, power, smith: smith.name };
}

const itemName = it => it.name + (it.plus ? ` +${it.plus}` : '');

/** Verstärken: +1 … +10. Je höher, desto riskanter – ab +6 kann es eine Stufe zurückgehen. */
function enhanceItem(n, o, slot, sim) {
  const it = o.gear[slot];
  it.plus = it.plus || 0; it.base = it.base || it.power;
  const smith = n.cls === 'schmied' || n.cls === 'sternenschmied' ? 0.1 : 0;
  const chance = clamp(0.95 - it.plus * 0.085 + smith + skillLevel('forging', n.skills.forging) * 0.01, 0.1, 0.97);
  n.forged = (n.forged || 0) + 1; n.gainXp('forging', 1 + it.rarity);
  const t = sim.capital.smithy.tile;
  if (sim.rng() < chance) {
    it.plus++; it.power = Math.round(it.base * (1 + 0.12 * it.plus));
    sim.log(`✨ verstärkt ${itemName(it)} von ${o === n ? 'sich selbst' : o.name}! (+${it.power})`, n, true);
    sim.emit('system', `VERSTÄRKUNG ERFOLGREICH: ${itemName(it)}`);
    sim.float(t.x, t.y, `+${it.plus}!`, '#8fd3ff');
    if (it.plus >= 7) n.addTitle(sim, 'Meister der Verstärkung');
    if (o !== n) changeRelation(n, o, 6, sim);
  } else {
    const drop = it.plus >= 6;
    if (drop) { it.plus--; it.power = Math.round(it.base * (1 + 0.12 * it.plus)); }
    sim.log(`💥 Die Verstärkung von ${it.name} misslingt${drop ? ` – zurück auf +${it.plus}` : ''}.`, n, true);
    sim.emit('system', 'Verstärkung misslungen …');
    sim.float(t.x, t.y, '💥', '#ff6b6b');
  }
}

  hund:   { name: 'Hund', icon: '🐕', bonus: 'Laune +', w: 0 },

};
const PET_NAMES = ['Flocke', 'Funke', 'Krümel', 'Nebel', 'Pfote', 'Luna', 'Rauch', 'Kiesel', 'Glut', 'Sternchen', 'Moos', 'Blitz', 'Wuschel', 'Ember'];
const petIs = (n, ...kinds) => !!(n.pet && kinds.includes(n.pet.kind));
function givePet(n, kind, sim) {
  const used = new Set(sim.npcs.filter(o => o.pet).map(o => o.pet.name));
  const name = PET_NAMES.find(x => !used.has(x) && sim.rng() < 0.5) || pick(sim, PET_NAMES);

/** Gilden-Stufe: wächst mit allem, was die Erwachten erleben. */
function guildXp(sim, amount) {
  const g = sim.guild; if (!g) return;
  g.level = g.level || 1; g.xp = (g.xp || 0) + amount;
  const need = Math.round(150 * g.level ** 1.5);
  if (g.xp >= need) {
    g.xp -= need; g.level++;
    sim.log(`🛡️ Die „${g.name}“ steigt auf Gilden-Stufe ${g.level}! Alle Mitglieder bekommen mehr Erfahrung.`, null, true);
    sim.emit('system', `GILDE STUFE ${g.level}: ${g.name}`);
  }
}

function forgeItem(n, sim) {
  const target = pickGearTarget(sim);
  if (!target) return;
  const cur = target.npc.gear[target.slot];
  if (cur && (cur.plus || 0) < 10 && sim.rng() < 0.45) return enhanceItem(n, target.npc, target.slot, sim);
  const rarity = rollRarity(n, sim), item = makeItem(target.slot, rarity, target.npc, n, sim);
  const R = RARITIES[rarity], o = target.npc, old = o.gear[target.slot];
  n.forged = (n.forged || 0) + 1;
  n.gainXp('forging', 1 + rarity);
  if (!old || item.power > old.power) {
    if (old) sim.capital.storeItem(old); // das alte Teil wandert ins Lager
    o.gear[target.slot] = item;
    sim.log(`⚒️ schmiedet ${item.name} (${R.name}) für ${o === n ? 'sich selbst' : o.name}!`, n, true);
    if (o !== n) {
      changeRelation(n, o, n.hasSkill('seelenschmied') ? 60 : 20, sim);
      o.remember(sim, `Hat von ${n.name} ${item.name} bekommen 🎁`);
      if (n.hasSkill('seelenschmied')) o.loyalTo = n.id;
    }
  } else { sim.capital.storeItem(item); sim.log(`⚒️ schmiedet ${item.name} (${R.name}) – schwächer als das Alte, es wandert ins Lager.`, n); }
  sim.emit('system', rarity >= 3 ? `${R.name.toUpperCase()}ER GEGENSTAND! ${item.name}` : `Geschmiedet: ${item.name} (${R.name})`);
  if (rarity >= 3) { sim.emit('legendary', { n, item }); n.addTitle(sim, rarity === 4 ? 'Mythenschmied' : 'Legendenschmied'); }
  const t = sim.capital.smithy.tile;
  sim.float(t.x, t.y, `${R.name}!`, R.color);
}

/* ---- Monster und Kampf ------------------------------------------------- */
const MONSTERS = {
  rissling:     { name: 'Rissling', hp: 40, atk: 5, speed: 0.22, tier: 1, xp: 25 },
  schattenwolf: { name: 'Schattenwolf', hp: 75, atk: 8, speed: 0.32, tier: 2, xp: 50 },
  aschegolem:   { name: 'Aschegolem', hp: 180, atk: 14, speed: 0.13, tier: 3, xp: 110 },
  kronenfresser:{ name: 'Kronenfresser', hp: 1400, atk: 13, speed: 0.11, tier: 4, xp: 600 }, // Boss der Geschichte
};
function nearestMonster(n, sim, r) {
  let best = null, bd = r;
  for (const m of sim.monsters) { const d = Math.hypot(m.x - n.x, m.y - n.y); if (d < bd) { bd = d; best = m; } }
  return best;
}
function killMonster(m, n, sim) {
  const M = MONSTERS[m.kind];
  m.hp = 0; m.killer = n;
  const drop = M.tier >= 4 ? 15 : M.tier === 3 ? 2 : sim.rng() < 0.4 ? 1 : 0;
  n.town.stock.crystals += drop;
  sim.log(`⚔️ besiegt einen ${M.name}! (+${M.xp} EP${drop ? `, +${drop} 💎` : ''})`, n, true);
  sim.emit('system', `${M.name} besiegt!`);
  sim.emit('monsterKilled', m);
  n.kills = (n.kills || 0) + 1;
  n.gainXp('combat', 1);
  n.addXp(sim, M.xp);
  n.remember(sim, `Hat einen ${M.name} besiegt ⚔️`);
  if (n.kills >= 5) n.addTitle(sim, 'Wächter des Dorfes');
}

defineAction({
  id: 'fight', label: 'kämpft', short: 'Kämpfen', start: 'stellt sich dem Monster', icon: '⚔️',
  score: (n, sim) => n.awakened && n.hp > n.maxHp * 0.35 && nearestMonster(n, sim, 14) ? 96 : 0,
  urgent: (n, sim) => n.awakened && n.hp > n.maxHp * 0.35 && !!nearestMonster(n, sim, 10),
  think: (n, sim) => { const m = nearestMonster(n, sim, 14); return m ? `Ein ${MONSTERS[m.kind].name}! Ich beschütze das Dorf.` : 'Ich halte Wache.'; },
  plan(n, sim) {
    const m = nearestMonster(n, sim, 14);
    if (!m) return null;
    const mt = sim.world.tile(Math.round(m.x), Math.round(m.y));
    const res = sim.world.findAdjacent(n.x, n.y, t => t === mt, 3000);
    n.foe = m;
    return [move(res ? res.path.slice(0, 8) : []), act((n, sim, s) => {
      if (m.hp <= 0 || Math.hypot(m.x - n.x, m.y - n.y) > 1.7) return 'done';
      if (Math.abs(m.x - n.x) > 0.1) n.facing = m.x > n.x ? 1 : -1;
      if (s.t % 2) return;
      const dmg = Math.round(n.attack * (0.8 + sim.rng() * 0.4));
      m.hp -= dmg; m.hitAt = performance.now();
      sim.float(m.x, m.y - 0.3, `-${dmg}`, '#ffd166');
      sim.emit('hit', m);
      if (m.hp <= 0) { killMonster(m, n, sim); return 'done'; }
    }, { face: m, fight: true })];
  },
  onEnd(n) { n.foe = null; },
});

defineAction({
  id: 'flee', label: 'versteckt sich', short: 'Verstecken', start: 'flieht vor einem Monster', icon: '😱',
  interruptible: false,
  score: (n, sim) => !n.awakened && nearestMonster(n, sim, 7) ? 94 : 0,
  urgent: (n, sim) => !n.awakened && !!nearestMonster(n, sim, 5),

defineAction({
  id: 'exploreGate', label: 'kämpft im Riss', short: 'Riss', start: 'bricht zu einem Riss auf', icon: '🌀',
  interruptible: false,
  score(n, sim) {
    if (!n.awakened || n.level < CONFIG.gates.minLevel || sim.isNight || sim.hourFloat > 17) return 0;
    if (sim.minutes - n.lastGate < CONFIG.gates.cooldownMinutes) return 0;
    if (n.energy < 65 || n.hunger > 45) return 0;
    return 42 + n.level * 2 + (n.cls === 'torwandler' ? 15 : 0);
  },
  think: n => n.cls === 'torwandler' ? 'Der Riss ruft mich. Dort wartet mehr auf mich als auf jeden anderen.' : 'Ich muss stärker werden. Hinter dem Riss wartet echte Erfahrung.',
  describe: n => n.gateTarget ? `bricht zum ${n.gateTarget.gate.name} auf (Rang ${roman(n.gateTarget.gate.tier)})` : 'bricht zu einem Riss auf',
  plan(n, sim) {
    const maxTier = 1 + Math.floor((n.level - CONFIG.gates.minLevel) / 3);
    const res = sim.world.findAdjacent(n.x, n.y, t => t.type === 'gate' && t.gate.tier <= maxTier);
    if (!res) return null;
    const gate = res.target;
    n.gateTarget = gate;
    return [move(res.path), act((n, sim, s) => {
      if (s.t === 1) {
        n.inside = { tile: gate, gate: true }; n.lastGate = sim.minutes;
        sim.log(`🌀 betritt den ${gate.gate.name} (Rang ${roman(gate.gate.tier)}).`, n, true);
        sim.emit('system', `${n.name} betritt den ${gate.gate.name}.`);
      }
      n.energy = Math.max(0, n.energy - 0.12 * gate.gate.tier);
      if (s.t < CONFIG.gates.expeditionMinutes) return;
      finishGate(n, gate, sim);
      return 'done';
    }, { face: gate })];
  },
  onEnd(n) { n.inside = null; n.gateTarget = null; },
});

function finishGate(n, gate, sim) {
  const g = gate.gate, power = n.level + (n.stats.kraft + n.stats.geschick) * 0.3;
  const chance = clamp(0.55 + (power - g.tier * 5) * 0.06, 0.15, 0.95);
  n.gainXp('gate', 1);
  if (sim.rng() < chance) {
    let crystals = g.tier + Math.floor(sim.rng() * (g.tier + 1));
    if (n.hasSkill('torsicht')) crystals *= 2;
    const xp = 35 * g.tier;
    n.town.stock.crystals += crystals; g.cleared++; n.gatesCleared++;
    sim.log(`💎 kehrt siegreich aus dem ${g.name} zurück: +${crystals} Mana-Kristalle, +${xp} EP!`, n, true);
    sim.emit('system', `Riss bezwungen! Beute: ${crystals} Mana-Kristalle`);
    sim.float(gate.x, gate.y, `💎 +${crystals}`, '#c9b6ff');
    n.remember(sim, `Hat den ${g.name} bezwungen 💎`);
    n.mood = Math.min(100, n.mood + 20);
    n.addXp(sim, xp);
  } else {
    g.failed++;
    n.energy = 5; n.hunger = Math.min(100, n.hunger + 25); n.mood = Math.max(0, n.mood - 25);
    sim.log(`🩸 kehrt verwundet aus dem ${g.name} zurück …`, n, true);
    sim.emit('system', `${n.name} musste aus dem Riss fliehen.`);
    n.remember(sim, `Musste verwundet aus dem ${g.name} fliehen 🩸`);
    n.addXp(sim, 10 * g.tier);
  }
}
