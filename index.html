    if (this.spriteTs !== this.ts && (settled || !this.spriteTs)) this.buildSprites();
    if (this.groundTs !== this.ts && (settled || !this.groundTs)) this.buildGround();
    this.refreshDirtyGround();
    const s = this.ts, sk = s / this.spriteTs; // während des Zoomens Sprites skalieren
    const { w, h } = sim.world, dpr = this.dpr, W = this.canvas.width, H = this.canvas.height;

    if (this.follow && !this.follow.inside) {
      const tx = (this.follow.x + 0.5) * s - this.viewW / 2, ty = (this.follow.y + 0.5) * s - this.viewH / 2;
      this.camX += (tx - this.camX) * 0.08; this.camY += (ty - this.camY) * 0.08; this.clampCam();
    }
    const world = () => c.setTransform(dpr, 0, 0, dpr, -this.camX * dpr, -this.camY * dpr);
    const screen = () => c.setTransform(1, 0, 0, 1, 0, 0);
    c.lineJoin = 'round'; c.lineCap = 'butt';
    screen(); c.fillStyle = '#16231a'; c.fillRect(0, 0, W, H);
    world();

    const x0 = Math.max(0, Math.floor(this.camX / s) - 1), x1 = Math.min(w - 1, Math.ceil((this.camX + this.viewW) / s));
    const y0 = Math.max(0, Math.floor(this.camY / s) - 1), y1 = Math.min(h - 1, Math.ceil((this.camY + this.viewH) / s) + 2);

    // 1) Boden
    const gk = this.groundCv.width / (w * s);
    const vx = Math.max(0, this.camX), vy = Math.max(0, this.camY);
    const vw = Math.min(w * s, this.camX + this.viewW) - vx, vh = Math.min(h * s, this.camY + this.viewH) - vy;
    if (vw > 0 && vh > 0) c.drawImage(this.groundCv, vx * gk, vy * gk, vw * gk, vh * gk, vx, vy, vw, vh);

    // 2) Wasser in Bewegung
    c.lineWidth = Math.max(1, s * 0.03);
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const t = sim.world.tile(x, y);
      if (t.type !== 'water') continue;
      for (let k = 0; k < 2; k++) {
        const yy = (y + 0.3 + k * 0.4) * s + Math.sin(now / 900 + x * 1.3 + k * 2) * s * 0.04;
        c.strokeStyle = `rgba(255,255,255,${0.1 + 0.08 * Math.sin(now / 700 + x + y * 2 + k)})`;
        c.beginPath();
        for (let j = 0; j <= 4; j++) c.lineTo((x + j / 4) * s, yy + Math.sin(now / 600 + (x + j / 4) * 4 + k) * s * 0.03);
        c.stroke();
      }
    }

    // Siedler vorbereiten
    const rows = new Map(), drawn = [];
    for (const n of sim.npcs) {
      if (n.inside) continue;
      const fx = n.prevX + (n.x - n.prevX) * alpha, fy = n.prevY + (n.y - n.prevY) * alpha;
      const pose = this.pose(n);
      const off = pose.moving ? 0 : (n.id % 3 - 1) * 0.16;
      const e = { n, px: (fx + 0.5 + off) * s, py: (fy + 0.5) * s, fy, pose };
      const r = clamp(Math.round(fy), y0, y1);
      (rows.get(r) || rows.set(r, []).get(r)).push(e);
      drawn.push(e);
    }

    // 3) Sonnenschatten (in eigener Ebene, damit sich Schatten nicht doppelt abdunkeln)
    const sun = this.sunInfo();
    if (sun.alpha > 0.01 && this.spriteTs) {
      const sc = this.shadowCv.getContext('2d');
      sc.setTransform(1, 0, 0, 1, 0, 0); sc.clearRect(0, 0, W, H);
      sc.setTransform(dpr, 0, 0, dpr, -this.camX * dpr, -this.camY * dpr);
      const shadow = (sp, bx, by) => {
        sc.save(); sc.translate(bx, by); sc.transform(sk, 0, -sun.dx * sun.len * sk, 0.3 * sk, 0, 0);
        sc.drawImage(sp.sh, -sp.ax, -sp.ay, sp.w, sp.h); sc.restore();
      };
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
        const t = sim.world.tile(x, y);
        if (t.type === 'tree') { const [bx, by] = this.treeBase(t, s); shadow(this.treeSprite(t), bx, by); }
        else if (t.type === 'house') shadow(this.sprites['house' + t.building.id % ROOFS.length], (x + 0.5) * s, (y + 0.95) * s);
        else if (t.type === 'bush') shadow(this.sprites.bush, (x + 0.5) * s, (y + 0.86) * s);
      }
      sc.fillStyle = '#000';
      for (const e of drawn) {
        if (e.n.sleeping) continue;
        sc.beginPath(); sc.ellipse(e.px + sun.dx * sun.len * s * 0.3, e.py + s * 0.36, s * (0.14 + sun.len * 0.14), s * 0.06, 0, 0, TAU); sc.fill();
      }
      screen(); c.globalAlpha = sun.alpha; c.drawImage(this.shadowCv, 0, 0); c.globalAlpha = 1; world();
    }
    // Kontaktschatten (immer)
    c.fillStyle = 'rgba(0,0,0,.25)';
    for (const e of drawn) if (!e.n.sleeping) { c.beginPath(); c.ellipse(e.px, e.py + s * 0.38, s * 0.15, s * 0.05, 0, 0, TAU); c.fill(); }

    // Weg des ausgewählten Siedlers
    const sel = drawn.find(e => e.n === selected);
    if (sel && sel.pose.moving) {
      c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = Math.max(1.5, s * 0.05); c.setLineDash([s * 0.15, s * 0.15]);
      c.beginPath(); c.moveTo(sel.px, sel.py + s * 0.35);
      for (const q of sel.pose.step.path) c.lineTo((q.x + 0.5) * s, (q.y + 0.85) * s);
      c.stroke(); c.setLineDash([]);
    }

    // 4) Objekte und Siedler Reihe für Reihe
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const t = sim.world.tile(x, y);
        switch (t.type) {
          case 'tree': {
            const [bx, by] = this.treeBase(t, s), sp = this.treeSprite(t);
            const sway = Math.sin(now / 1400 + x * 0.7 + y * 0.3) * 0.025 * (sim.weather === 'regen' ? 2 : 1);
            const hit = t.hitAt && now - t.hitAt < 300 ? Math.sin(now / 22) * 0.04 : 0;
            c.save(); c.translate(bx, by); c.transform(sk, 0, (sway + hit) * sk, sk, 0, 0);
            c.drawImage(sp.cv, -sp.ax, -sp.ay, sp.w, sp.h); c.restore();
            break;
          }
          case 'stump': { const sp = this.sprites.stump; c.drawImage(sp.cv, (x + 0.5) * s - sp.ax * sk, (y + 0.75) * s - sp.ay * sk, sp.w * sk, sp.h * sk); break; }
          case 'bush': {
            const sp = this.sprites.bush, bx = (x + 0.5) * s, by = (y + 0.86) * s;
            c.drawImage(sp.cv, bx - sp.ax * sk, by - sp.ay * sk, sp.w * sk, sp.h * sk);
            for (let i = 0; i < t.berries && i < BERRY_SPOTS.length; i++) {
              const qx = bx + BERRY_SPOTS[i][0] * s, qy = by + BERRY_SPOTS[i][1] * s, r = Math.max(1.5, s * 0.05);
              c.fillStyle = '#9e1f4f'; c.beginPath(); c.arc(qx, qy, r, 0, TAU); c.fill();
              c.fillStyle = '#e0457b'; c.beginPath(); c.arc(qx - r * 0.25, qy - r * 0.25, r * 0.6, 0, TAU); c.fill();
            }
            break;
          }
          case 'house': {
            const sp = this.sprites['house' + t.building.id % ROOFS.length];
            c.drawImage(sp.cv, (x + 0.5) * s - sp.ax * sk, (y + 0.95) * s - sp.ay * sk, sp.w * sk, sp.h * sk);
            break;
          }
          case 'site': if (sim.settlement.site) this.drawSite(c, t, s, now, sim.settlement.site); break;
          case 'camp': this.drawCamp(c, t, s, now); break;
        }
      }
      const list = rows.get(y);
      if (list) {
        list.sort((a, b) => a.fy - b.fy);
        for (const e of list) {
          if (e.n === selected) { c.strokeStyle = '#f0b54a'; c.lineWidth = 2; c.beginPath(); c.ellipse(e.px, e.py + s * 0.38, s * 0.26, s * 0.09, 0, 0, TAU); c.stroke(); }
          this.drawSettler(c, e.n, e.px, e.py, s, now, e.pose);
        }
      }
    }

    // 5) Partikel, Rauch
    this.emitAmbient(dt, x0, x1, y0, y1, this.nightAlpha(), drawn);
    this.updateParticles(dt);
    this.drawParticles(c, s, now, false);
    for (const b of sim.settlement.houses) {
      if (!b.residents.length) continue;
      const sx = (b.tile.x + 0.75) * s, sy = (b.tile.y + 0.95 - 1.07) * s;
      for (let k = 0; k < 4; k++) {
        const q = (now / 3000 + k / 4 + b.id * 0.37) % 1;
        c.fillStyle = `rgba(225,225,225,${0.35 * (1 - q)})`;
        c.beginPath(); c.arc(sx + Math.sin(q * 5 + b.id) * s * 0.1 + q * s * 0.15, sy - q * s * 0.8, s * (0.05 + q * 0.1), 0, TAU); c.fill();
      }
    }

    // 6) Wolkenschatten
    const na = this.nightAlpha(), day = 1 - na / 0.72;
    const cloudA = ({ klar: 0.07, 'bewölkt': 0.15, regen: 0.18 }[sim.weather] ?? 0.07) * day;
    for (const cl of this.clouds) {
      cl.x += cl.v * dt * 0.5; if (cl.x - cl.r > w + 2) cl.x = -cl.r - 2;
      if (cloudA <= 0.005) continue;
      const g = c.createRadialGradient(cl.x * s, cl.y * s, 0, cl.x * s, cl.y * s, cl.r * s);
      g.addColorStop(0, `rgba(0,0,20,${cloudA})`); g.addColorStop(1, 'rgba(0,0,20,0)');
      c.fillStyle = g; c.fillRect((cl.x - cl.r) * s, (cl.y - cl.r) * s, cl.r * 2 * s, cl.r * 2 * s);
    }

    // 7) Farbstimmung je Tageszeit und Wetter
    screen();
    const hr = sim.hourFloat;
    const dawn = smooth(4.8, 6.2, hr) * (1 - smooth(6.6, 8.5, hr));
    const dusk = smooth(16.5, 18.8, hr) * (1 - smooth(20, 21.5, hr));
    if (dawn > 0.01) { c.fillStyle = `rgba(255,150,120,${0.16 * dawn})`; c.fillRect(0, 0, W, H); }
    if (dusk > 0.01) { c.fillStyle = `rgba(255,140,50,${0.2 * dusk})`; c.fillRect(0, 0, W, H); }
    if (sim.weather === 'bewölkt') { c.fillStyle = 'rgba(70,80,95,.12)'; c.fillRect(0, 0, W, H); }
    if (sim.weather === 'regen') {
      c.fillStyle = 'rgba(45,55,75,.25)'; c.fillRect(0, 0, W, H);
      c.strokeStyle = 'rgba(190,210,240,.45)'; c.lineWidth = Math.max(1, dpr * 0.8); c.beginPath();
      for (const d of this.rain) {
        d.y += d.v * dt * 1.4; d.x += dt * 0.08;
        if (d.y > 1) { d.y -= 1; d.x = Math.random(); }
        if (d.x > 1) d.x -= 1;
        const px = d.x * W, py = d.y * H;
        c.moveTo(px, py); c.lineTo(px - 3 * dpr, py + d.l * 16 * dpr);
      }
      c.stroke();
    }

    // 8) Nacht: Lichtkarte mit Löchern für Feuer und Fenster
    if (na > 0.01) {
      const lc = this.lightCv.getContext('2d');
      lc.setTransform(1, 0, 0, 1, 0, 0); lc.globalCompositeOperation = 'source-over'; lc.clearRect(0, 0, W, H);
      lc.fillStyle = `rgba(6, 10, 34, ${na})`; lc.fillRect(0, 0, W, H);
      lc.setTransform(dpr, 0, 0, dpr, -this.camX * dpr, -this.camY * dpr); lc.globalCompositeOperation = 'destination-out';
      const hole = (x, y, r, a) => {
        const g = lc.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(0.5, `rgba(0,0,0,${a * 0.6})`); g.addColorStop(1, 'rgba(0,0,0,0)');
        lc.fillStyle = g; lc.fillRect(x - r, y - r, r * 2, r * 2);
      };
      const cp = sim.settlement.camp, fl = 1 + Math.sin(now / 110) * 0.04 + Math.sin(now / 47) * 0.03;
      const fx = (cp.x + 0.58) * s, fy = (cp.y + 0.55) * s;
      hole(fx, fy, s * 4.2 * fl, 0.95);
      for (const b of sim.settlement.houses) if (b.residents.length) hole((b.tile.x + 0.5) * s, (b.tile.y + 0.6) * s, s * 1.8, 0.65);
      screen(); c.drawImage(this.lightCv, 0, 0); world();
      // warmes Licht
      c.save(); c.globalCompositeOperation = 'lighter';
      const glow = (x, y, r, a) => {
        const g = c.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, `rgba(255,150,50,${a})`); g.addColorStop(1, 'rgba(255,150,50,0)');
        c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2);
      };
      glow(fx, fy, s * 3 * fl, na * 0.5);
      for (const b of sim.settlement.houses) if (b.residents.length) glow((b.tile.x + 0.5) * s, (b.tile.y + 0.5) * s, s, na * 0.3);
      c.restore();
      c.fillStyle = `rgba(255, 210, 110, ${Math.min(1, na * 1.5)})`;
      for (const b of sim.settlement.houses) {
        if (!b.residents.length) continue;
        for (const ox of [-0.305, 0.305]) c.fillRect((b.tile.x + 0.5 + ox - 0.075) * s, (b.tile.y + 0.95 - 0.545) * s, 0.15 * s, 0.15 * s);
      }
    }
    world();
    // leuchtende Partikel (Funken, Glühwürmchen)
    c.save(); c.globalCompositeOperation = 'lighter'; this.drawParticles(c, s, now, true); c.restore();

    // 9) Beschriftung
    c.textAlign = 'center';
    c.font = `700 ${Math.max(10, Math.round(s * 0.3))}px system-ui`;
    for (const b of sim.settlement.houses) {
      if (!b.sleepers.size) continue;
      const q = (now / 1800 + b.id * 0.3) % 1;
      c.globalAlpha = 1 - q; c.fillStyle = '#fff';
      c.fillText('z', (b.tile.x + 0.25 + q * 0.2) * s, (b.tile.y - 0.4 - q * 0.4) * s);
      c.globalAlpha = 1;
    }
    const showNames = s >= 30;
    for (const e of drawn) {
      const { n, px, pose } = e, top = e.py - s * 0.38;
      if (n.sleeping) {
        c.fillStyle = '#fff'; c.font = `700 ${Math.max(10, Math.round(s * 0.3))}px system-ui`;
        c.fillText('z', px + s * 0.1, e.py - s * 0.05 - ((now / 700) % 1) * s * 0.3); continue;
      }
      if (n === selected && n.thought) { this.drawThought(c, px, top - s * 0.05, n.thought, s); continue; }
      if (showNames) {
        c.font = `600 ${Math.max(10, Math.round(s * 0.26))}px system-ui`;
        c.lineWidth = 3; c.strokeStyle = 'rgba(0,0,0,.6)'; c.strokeText(n.name, px, top);
        c.fillStyle = '#fff'; c.fillText(n.name, px, top);
      }
      const a = n.action;
      if (a && a.icon && s >= 22 && !pose.moving) {
        const bx = px + s * 0.34, by = top - s * 0.3, br = Math.max(8, s * 0.19);
        c.fillStyle = 'rgba(255,255,255,.92)'; c.beginPath(); c.arc(bx, by, br, 0, TAU); c.fill();
        c.beginPath(); c.moveTo(bx - br * 0.5, by + br * 0.6); c.lineTo(px + s * 0.12, top + s * 0.02); c.lineTo(bx, by + br * 0.9); c.fill();
        c.font = `${Math.round(br * 1.1)}px system-ui`; c.textBaseline = 'middle';
        c.fillText(a.icon, bx, by + 1); c.textBaseline = 'alphabetic';
      }
    }
    // schwebende Texte
    c.font = `700 ${Math.max(11, Math.round(s * 0.34))}px system-ui`;
    sim.floats = sim.floats.filter(f => now - f.born < 1400);
    for (const f of sim.floats) {
      const k = (now - f.born) / 1400, fx = (f.x + 0.5) * s, fy = (f.y - k) * s;
      c.globalAlpha = 1 - k * k;
      c.lineWidth = 3; c.strokeStyle = 'rgba(0,0,0,.7)'; c.strokeText(f.text, fx, fy);
      c.fillStyle = f.color; c.fillText(f.text, fx, fy);
    }
    c.globalAlpha = 1; c.textAlign = 'start';

    // 10) Vignette
    screen(); c.drawImage(this.vignetteCv, 0, 0);
  }

  /** Gedankenblase über dem ausgewählten Siedler. */
  drawThought(c, px, top, text, s) {
    const fs = Math.max(11, Math.min(14, Math.round(s * 0.3)));
    c.font = `italic 500 ${fs}px system-ui`;
    const maxW = Math.min(200, this.viewW - 40), words = text.split(' '), lines = [];
    let line = '';
    for (const wd of words) {
      const test = line ? line + ' ' + wd : wd;
      if (c.measureText(test).width > maxW && line) { lines.push(line); line = wd; } else line = test;
    }
    if (line) lines.push(line);
    if (lines.length > 4) { lines.length = 4; lines[3] += ' …'; }
    const bw = Math.max(...lines.map(l => c.measureText(l).width)) + 18, bh = lines.length * (fs + 3) + 12;
    let bx = clamp(px - bw / 2, this.camX + 6, this.camX + this.viewW - bw - 6);
    const by = Math.max(this.camY + 6, top - bh - s * 0.35);
    c.fillStyle = 'rgba(255,255,255,.95)';
    c.beginPath(); c.roundRect ? c.roundRect(bx, by, bw, bh, 10) : c.rect(bx, by, bw, bh); c.fill();
    c.beginPath(); c.arc(px + s * 0.05, top - s * 0.18, s * 0.07, 0, TAU); c.fill();
    c.beginPath(); c.arc(px + s * 0.1, top - s * 0.3, s * 0.045, 0, TAU); c.fill();
    c.fillStyle = '#2a2420'; c.textAlign = 'left'; c.textBaseline = 'top';
    lines.forEach((l, i) => c.fillText(l, bx + 9, by + 7 + i * (fs + 3)));
    c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  }
}

/* =====================================================================
 * 8b) KLANG – alles live erzeugt (Web Audio), keine Dateien
 * Musik: weiche Pentatonik-Töne mit Hall. Natur: Wind, Vögel am Tag,
 * Grillen nachts, Lagerfeuer, Regen. Ereignisse: Axt, Glockenspiel.
 * ===================================================================== */
class Sound {
  constructor() { this.ctx = null; this.on = false; this.nextNote = 0; this.nextBird = 0; this.nextCricket = 0; this.nextCrackle = 0; }

  start() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      const a = this.ctx = new AC();
      this.master = a.createGain(); this.master.gain.value = 0.7; this.master.connect(a.destination);
      // Hall: zwei rückgekoppelte Echos
      this.verb = a.createGain(); this.verb.gain.value = 0.35;
      const d1 = a.createDelay(), d2 = a.createDelay(), fb = a.createGain(), lp = a.createBiquadFilter();
      d1.delayTime.value = 0.23; d2.delayTime.value = 0.37; fb.gain.value = 0.45; lp.type = 'lowpass'; lp.frequency.value = 2200;
      this.verb.connect(d1); d1.connect(d2); d2.connect(lp); lp.connect(fb); fb.connect(d1); lp.connect(this.master);
      // Rauschquelle für Wind, Regen, Feuer
      const buf = a.createBuffer(1, a.sampleRate * 2, a.sampleRate), data = buf.getChannelData(0);
      let last = 0;
      for (let i = 0; i < data.length; i++) { const wv = Math.random() * 2 - 1; last = (last + 0.02 * wv) / 1.02; data[i] = last * 3.5; }
      this.noiseBuf = buf;
      const loop = (type, freq, q) => {
        const src = a.createBufferSource(); src.buffer = buf; src.loop = true;
        const f = a.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
        const g = a.createGain(); g.gain.value = 0;
        src.connect(f); f.connect(g); g.connect(this.master); src.start();
        return g;
      };
      this.wind = loop('lowpass', 500, 0.5);
      this.rainGain = loop('highpass', 1200, 0.3);
      this.fire = loop('bandpass', 700, 0.8);
    }
    this.ctx.resume();
    this.on = true;
    return true;
  }

  stop() { this.on = false; if (this.ctx) this.ctx.suspend(); }

  tone(freq, when, dur, vol, type = 'sine', toVerb = true) {
    const a = this.ctx, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(vol, when + Math.min(0.4, dur * 0.3));
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    o.connect(g); g.connect(this.master); if (toVerb) g.connect(this.verb);
    o.start(when); o.stop(when + dur + 0.05);
  }

  chime() { // Glockenspiel bei Ereignissen
    if (!this.on) return;
    const t = this.ctx.currentTime;
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => this.tone(f, t + i * 0.12, 1.4, 0.07, 'triangle'));
  }

  chop(dist) { // dumpfer Axtschlag, leiser je weiter weg
    if (!this.on || dist > 9) return;
    const a = this.ctx, t = a.currentTime, vol = 0.18 * (1 - dist / 10);
    const src = a.createBufferSource(); src.buffer = this.noiseBuf;
    const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = 2;
    const g = a.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    src.connect(f); f.connect(g); g.connect(this.master); src.start(t, Math.random()); src.stop(t + 0.15);
    this.tone(140, t, 0.12, vol * 0.6, 'sine', false);
  }

  /** Läuft jedes Bild: Lautstärken an Tageszeit, Wetter und Kamera anpassen, Zufallsklänge. */
  update(sim, renderer) {
    if (!this.on || !this.ctx) return;
    const a = this.ctx, t = a.currentTime, h = sim.hourFloat;
    const night = renderer.nightAlpha() / 0.72, raining = sim.weather === 'regen';
    const cp = sim.settlement.camp;
    const camTx = (renderer.camX + renderer.viewW / 2) / renderer.ts, camTy = (renderer.camY + renderer.viewH / 2) / renderer.ts;
    const fireNear = clamp(1 - Math.hypot(cp.x - camTx, cp.y - camTy) / 9, 0, 1);
    const ramp = (g, v) => g.gain.setTargetAtTime(v, t, 0.8);
    ramp(this.wind, 0.05 + (sim.weather === 'bewölkt' ? 0.04 : 0) + (raining ? 0.05 : 0));
    ramp(this.rainGain, raining ? 0.12 : 0);
    ramp(this.fire, 0.05 * fireNear * (0.5 + night));
    // Musik: ruhige Töne aus einer Pentatonik, nachts tiefer und seltener
    if (t > this.nextNote) {
      const scale = [261.63, 293.66, 329.63, 392.0, 440.0, 523.25, 587.33];
      const f = scale[Math.floor(Math.random() * scale.length)] * (night > 0.5 ? 0.5 : 1);
      this.tone(f, t, 3.5, 0.045, 'sine');
      if (Math.random() < 0.4) this.tone(f * 1.5, t + 0.05, 3, 0.02, 'triangle');
      this.nextNote = t + (night > 0.5 ? 3.5 : 2.2) + Math.random() * 2.5;
    }
    // Vögel am Tag
    if (night < 0.3 && !raining && t > this.nextBird) {
      const base = 2200 + Math.random() * 1600, n = 2 + Math.floor(Math.random() * 4);
      for (let i = 0; i < n; i++) {
        const o = a.createOscillator(), g = a.createGain(), st = t + i * 0.11;
        o.frequency.setValueAtTime(base, st); o.frequency.exponentialRampToValueAtTime(base * (1.2 + Math.random() * 0.4), st + 0.07);
        g.gain.setValueAtTime(0, st); g.gain.linearRampToValueAtTime(0.03, st + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, st + 0.09);
        o.connect(g); g.connect(this.master); g.connect(this.verb); o.start(st); o.stop(st + 0.1);
      }
      this.nextBird = t + 2 + Math.random() * 6;
    }
    // Grillen in der Nacht
    if (night > 0.5 && !raining && t > this.nextCricket) {
      for (let i = 0; i < 3; i++) {
        const o = a.createOscillator(), g = a.createGain(), st = t + i * 0.06;
        o.frequency.value = 4400; g.gain.setValueAtTime(0, st); g.gain.linearRampToValueAtTime(0.012, st + 0.01); g.gain.linearRampToValueAtTime(0, st + 0.04);
        o.connect(g); g.connect(this.master); o.start(st); o.stop(st + 0.05);
      }
      this.nextCricket = t + 0.6 + Math.random() * 1.2;
    }
    // Knistern am Feuer
    if (fireNear > 0.1 && t > this.nextCrackle) {
      const src = a.createBufferSource(); src.buffer = this.noiseBuf;
      const f = a.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 2500;
      const g = a.createGain(); g.gain.setValueAtTime(0.08 * fireNear, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
      src.connect(f); f.connect(g); g.connect(this.master); src.start(t, Math.random()); src.stop(t + 0.04);
      this.nextCrackle = t + 0.05 + Math.random() * 0.4;
    }
  }
}

/* =====================================================================
 * 9) OBERFLÄCHE: HUD, Log, Siedlerliste, Steckbrief, Speichern, Ton
 * ===================================================================== */
const $ = id => document.getElementById(id);
const SAVE_KEY = 'siedlung-save-v1';
const SOUND_KEY = 'siedlung-sound';
const ui = { speed: 1, selected: null, accum: 0, confirmNew: 0 };
const sound = new Sound();
let sim, renderer;

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function store(key, val) { try { if (val === undefined) return localStorage.getItem(key); localStorage.setItem(key, val); } catch (e) { return null; } }

function renderLog() {
  $('log').innerHTML = sim.logEntries.slice(0, 40).map(e => {
    const who = e.npc ? `<span class="who" style="color:${e.npc.color}">${esc(e.npc.name)}</span> ` : '';
    return `<li class="${e.event ? 'event' : ''}"><span class="t">T${e.day} ${e.clock}</span>${who}${esc(e.text)}</li>`;
  }).join('');
}

function buildRoster() {
  $('roster').innerHTML = sim.npcs.map(n =>
    `<button class="chip" data-id="${n.id}"><span class="dot" style="background:${n.color}"></span><span>${esc(n.name)}</span><span class="ic"></span></button>`).join('');
  $('roster').querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => select(sim.npcs.find(n => n.id === Number(b.dataset.id)))));
  updateRoster();
}

function updateRoster() {
  $('roster').querySelectorAll('.chip').forEach(b => {
    const n = sim.npcs.find(x => x.id === Number(b.dataset.id));
    if (!n) return;
    b.classList.toggle('sel', n === ui.selected);
    b.querySelector('.ic').textContent = `${n.moodEmoji}${n.action ? n.action.icon : ''}`;
  });
}

const bar = (label, v, color) =>
  `<div><div class="lbl"><span>${label}</span><span>${Math.round(v)}</span></div><div class="bar"><i style="width:${v}%;background:${color}"></i></div></div>`;
const relLabel = v => v >= 50 ? 'Freund' : v >= 20 ? 'gut bekannt' : v >= 0 ? 'kennt sich' : 'mag nicht';
const SKILL_NAMES = { woodcutting: 'Holzfällen', building: 'Bauen', gathering: 'Sammeln' };

function updateInspector() {
  const n = ui.selected, box = $('inspector');
  if (!n) { box.innerHTML = '<p class="empty">Tippe einen Siedler an (auf der Karte oder oben in der Liste), um seine Gedanken zu lesen.</p>'; return; }
  const a = n.action;
  const rels = Object.entries(n.relations).map(([id, v]) => ({ o: sim.npcs.find(x => x.id === Number(id)), v }))
    .filter(r => r.o).sort((p, q) => q.v - p.v).slice(0, 4);
  const skills = Object.entries(n.skills).map(([k, v]) => `${SKILL_NAMES[k] || k} ${v}`).join(' · ') || 'noch keine';
  box.innerHTML = `
    <div class="insp-head">
      <span class="dot big" style="background:${n.color}"></span>
      <div><b>${esc(n.name)}</b><div class="tags">${n.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div></div>
      <div class="mood" title="Laune">${n.moodEmoji}</div>
    </div>
    <div class="thought">💭 ${esc(n.thought || '…')}</div>
    <div class="doing">${a ? a.icon : ''} ${esc(n.statusText)} · ${n.home ? `🏠 wohnt in Haus Nr. ${n.home.id}` : '⛺ noch kein Haus'} · 🪵 ${n.inventory.wood}/${CONFIG.npc.carryCapacity}</div>
    <div class="bars">
      ${bar('Hunger', n.hunger, 'var(--hunger)')}${bar('Energie', n.energy, 'var(--energy)')}
      ${bar('Gemeinschaft', n.social, 'var(--social)')}${bar('Laune', n.mood, 'var(--mood)')}
    </div>
    <div class="sec"><h4>🧠 Abwägung bei der letzten Entscheidung</h4>${n.lastScores.map((e, i) => `<span class="score${i ? '' : ' win'}">${e.label} ${e.score}</span>`).join('') || '–'}</div>
    <div class="sec"><h4>❤️ Beziehungen</h4>${rels.length ? rels.map(r => `<span class="rel"><span class="dot" style="background:${r.o.color}"></span>${esc(r.o.name)} · ${relLabel(r.v)}</span>`).join('') : '<span class="muted">noch niemanden kennengelernt</span>'}</div>
    <div class="sec"><h4>📜 Erinnerungen</h4>${n.memories.length ? `<ul>${n.memories.slice(0, 5).map(m => `<li><span class="muted">T${m.day} ${m.clock}</span> ${esc(m.text)}</li>`).join('')}</ul>` : '<span class="muted">noch keine</span>'}</div>
    <div class="sec"><h4>⭐ Erfahrung</h4>${skills}</div>`;
}

const WEATHER_ICON = { klar: ['☀️', '🌙'], 'bewölkt': ['⛅', '☁️'], regen: ['🌧️', '🌧️'] };
function updateHud() {
  const icon = WEATHER_ICON[sim.weather][sim.isNight ? 1 : 0];
  $('clock').textContent = `Tag ${sim.day} · ${sim.clock} ${icon}`;
  const st = sim.settlement, cost = CONFIG.buildings.house.cost.wood;
  const site = st.site ? ` · 🔨 Bau ${Math.floor(st.site.progress / st.site.work * 100)} %` : '';
  $('stats').innerHTML = `🪵 Lager <b>${st.stock.wood}</b>/${cost} · 🏠 <b>${st.houses.length}</b> · 👥 <b>${sim.npcs.length}</b>${site}`
    + `<div class="goal"><i style="width:${Math.min(100, st.stock.wood / cost * 100)}%"></i></div>`;
}

function select(n) {
  ui.selected = n && ui.selected !== n ? n : null;
  renderer.follow = ui.selected;
  updateRoster(); updateInspector();
}

function setSpeed(v) {
  ui.speed = v;
  document.querySelectorAll('#speed button').forEach(b => b.classList.toggle('active', Number(b.dataset.speed) === v));
}

function saveGame() {
  if (!sim) return;
  const ok = store(SAVE_KEY, JSON.stringify(sim.serialize())) !== null || store(SAVE_KEY) !== null;
  $('saveInfo').textContent = ok ? `💾 gespeichert (Tag ${sim.day} ${sim.clock})` : '';
}

function loadGame() {
  try { const raw = store(SAVE_KEY); const d = raw && JSON.parse(raw); return d && d.v === 1 ? d : null; } catch (e) { return null; }
}

function startSim(s) {
  sim = s;
  sim.on('log', e => { renderLog(); if (e.event && /fertig|kommt neu|Freunde/.test(e.text)) sound.chime(); });
  sim.on('npcAdded', buildRoster);
  sim.on('chop', t => {
    const cx = (renderer.camX + renderer.viewW / 2) / renderer.ts, cy = (renderer.camY + renderer.viewH / 2) / renderer.ts;
    if (ui.speed <= 2) sound.chop(Math.hypot(t.x - cx, t.y - cy));
  });
  ui.selected = null; ui.accum = 0;
  if (renderer) renderer.setSim(sim);
  else { renderer = new Renderer($('map'), sim); renderer.onTap = n => { if (n) select(n); }; }
  buildRoster(); renderLog(); updateHud(); updateInspector();
  $('seedInfo').textContent = `Welt #${sim.seed}`;
  window.SIM = sim; // zum Ausprobieren in der Browser-Konsole
}

function newWorld(seed) {
  const s = new Simulation(seed);
  s.log(`🔥 ${s.npcs.map(n => n.name).join(' und ')} schlagen ihr Lager auf.`, null, true);
  startSim(s);
  saveGame();
}

function setSound(on) {
  if (on) on = sound.start(); else sound.stop();
  $('soundBtn').textContent = on ? '🔊' : '🔇';
  $('soundBtn').classList.toggle('active', !!on);
  store(SOUND_KEY, on ? '1' : '0');
}

/* =====================================================================
 * 10) HAUPTSCHLEIFE und Start
 * ===================================================================== */
let last = performance.now(), lastPanel = 0;
function frame(now) {
  const dt = Math.min(0.25, (now - last) / 1000);
  last = now;
  ui.accum += dt * ui.speed * CONFIG.time.minutesPerSecond;
  while (ui.accum >= 1) { sim.step(); ui.accum -= 1; }
  renderer.render(ui.speed ? ui.accum : 1, ui.selected);
  sound.update(sim, renderer);
  updateHud();
  if (now - lastPanel > 300) { updateRoster(); updateInspector(); lastPanel = now; }
  requestAnimationFrame(frame);
}

document.querySelectorAll('#speed button').forEach(b => b.addEventListener('click', () => setSpeed(Number(b.dataset.speed))));
document.querySelectorAll('#zoomBtns [data-z]').forEach(b => b.addEventListener('click', () => renderer.setZoom(renderer.ts * Number(b.dataset.z))));
$('homeBtn').addEventListener('click', () => { select(null); const c = sim.world.camp; renderer.centerOn(c.x + 0.5, c.y + 0.5); });
$('soundBtn').addEventListener('click', () => setSound(!sound.on));
$('newWorld').addEventListener('click', () => {
  const btn = $('newWorld');
  if (Date.now() - ui.confirmNew < 3000) { ui.confirmNew = 0; btn.textContent = '🌍 Neue Welt'; newWorld(Math.floor(Math.random() * 1e6)); return; }
  ui.confirmNew = Date.now(); btn.textContent = 'Wirklich? Nochmal tippen';
  setTimeout(() => { if (ui.confirmNew && Date.now() - ui.confirmNew >= 3000) { ui.confirmNew = 0; btn.textContent = '🌍 Neue Welt'; } }, 3100);
});
window.addEventListener('resize', () => renderer.resize());
// Ton darf erst nach einer Berührung starten
window.addEventListener('pointerdown', () => { if (store(SOUND_KEY) !== '0' && !sound.on) setSound(true); }, { once: true });
setInterval(saveGame, 5000);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); });
window.addEventListener('pagehide', saveGame);

const urlSeed = Number(new URLSearchParams(location.search).get('seed'));
const saved = loadGame();
if (Number.isFinite(urlSeed) && urlSeed > 0) newWorld(urlSeed);
else if (saved) {
  try { startSim(new Simulation(saved.seed, saved)); sim.log('💾 Spielstand geladen – willkommen zurück!', null, true); }
  catch (e) { newWorld(Math.floor(Math.random() * 1e6)); }
} else newWorld(Math.floor(Math.random() * 1e6));
requestAnimationFrame(frame);

// Als App installierbar und offline nutzbar (nur auf der echten Webseite, z. B. GitHub Pages)
if ('serviceWorker' in navigator && location.protocol === 'https:' && window.self === window.top) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
